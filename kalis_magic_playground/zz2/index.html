<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>계산기</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    button {
      font: inherit;
    }

    .calculator {
      --pad-block-start: max(clamp(20px, 4vw, 28px), env(safe-area-inset-top));
      --pad-block-end: max(clamp(20px, 4vw, 28px), env(safe-area-inset-bottom));
      --layout-gap: clamp(16px, 4vw, 24px);
      --toolbar-height: clamp(34px, 8vw, 44px);
      --display-min: 96px;
      container-type: inline-size;
      width: min(100%, clamp(430px, 68vw, 560px));
      height: 100dvh;
      margin: 0 auto;
      padding:
        var(--pad-block-start)
        clamp(18px, 4vw, 24px)
        var(--pad-block-end);
      display: grid;
      grid-template-rows:
        var(--toolbar-height)
        minmax(var(--display-min), 1fr)
        auto;
      gap: var(--layout-gap);
      overflow: hidden;
      background: #000;
    }

    .toolbar {
      min-height: var(--toolbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #b8b8b8;
      pointer-events: none;
    }

    .toolbar-icon,
    .toolbar-tools {
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .toolbar svg {
      width: clamp(25px, 6cqw, 32px);
      height: clamp(25px, 6cqw, 32px);
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .root-mark {
      font-size: clamp(25px, 6cqw, 32px);
      font-weight: 400;
      line-height: 1;
    }

    .display {
      min-width: 0;
      display: flex;
      align-items: end;
      justify-content: end;
      padding: clamp(12px, 3cqw, 18px) 8px clamp(9px, 2.5cqw, 14px);
      overflow: hidden;
      font-size: clamp(48px, 15cqw, 76px);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-align: right;
      white-space: nowrap;
    }

    .keypad {
      --key-gap: clamp(11px, 3.5cqw, 20px);
      --btn-inline: calc((100cqw - 3 * var(--key-gap)) / 4);
      --btn-block: max(
        0px,
        calc(
          (
            100dvh
            - var(--pad-block-start)
            - var(--pad-block-end)
            - var(--toolbar-height)
            - var(--display-min)
            - 2 * var(--layout-gap)
            - 4 * var(--key-gap)
          ) / 5
        )
      );
      --btn: min(var(--btn-inline), var(--btn-block));
      display: grid;
      grid-template-columns: repeat(4, var(--btn));
      gap: var(--key-gap);
      justify-content: space-between;
    }

    .key {
      width: var(--btn);
      height: var(--btn);
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #292929;
      color: #f1f1f1;
      font-size: clamp(24px, 7cqw, 38px);
      font-weight: 400;
      cursor: default;
      user-select: none;
      touch-action: manipulation;
      transition: background-color 80ms ease, filter 80ms ease, opacity 120ms ease;
    }

    .key:active,
    .key.pressed {
      filter: brightness(1.18);
    }

    .key.utility {
      color: #ff625f;
    }

    .key.operator {
      color: #d9d9d9;
    }

    .key.equals {
      background: #00a99d;
      color: #fff;
      font-size: clamp(30px, 8cqw, 44px);
    }

    .key.parentheses {
      font-size: clamp(20px, 6cqw, 32px);
      letter-spacing: -0.08em;
    }

    .percent-glyph {
      width: 0.86em;
      height: 0.86em;
      overflow: visible;
      pointer-events: none;
    }

    .percent-glyph .percent-mark {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.15;
      stroke-linecap: round;
    }

    .percent-glyph .trick-dot {
      fill: currentColor;
      stroke: none;
      opacity: 0;
      transition: opacity 60ms linear;
    }

    .key.trick-set .trick-dot-top,
    .key.trick-ready .trick-dot {
      opacity: 1;
    }

    #selftest {
      display: none;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      background: #000;
      color: #f5f5f5;
      font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    #selftest.pass {
      color: #52d3a0;
    }

    #selftest.fail {
      color: #ff6b68;
    }
  </style>
</head>
<body>
  <main class="calculator" id="app" aria-label="계산기">
    <div class="toolbar" aria-hidden="true">
      <span class="toolbar-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7"></path>
          <path d="M3.5 4.5v4h4"></path>
          <path d="M12 7.5V12l3 2"></path>
        </svg>
      </span>
      <span class="toolbar-tools">
        <svg viewBox="0 0 24 24">
          <path d="m5 18 12-12 2 2L7 20H5v-2Z"></path>
          <path d="m11 12 2 2m1-5 2 2m-8 4 2 2"></path>
        </svg>
        <span class="root-mark">√</span>
      </span>
    </div>

    <output class="display" id="display" aria-live="polite">0</output>

    <section class="keypad" aria-label="계산기 키패드">
      <button class="key utility" type="button" data-key="C">C</button>
      <button class="key utility" type="button" data-key="⌫" aria-label="지우기">⌫</button>
      <button class="key operator" type="button" data-key="%" aria-label="퍼센트">
        <svg class="percent-glyph" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="percent-mark" cx="8" cy="8" r="4.25"></circle>
          <path class="percent-mark" d="M8 25 24 7"></path>
          <circle class="percent-mark" cx="24" cy="24" r="4.25"></circle>
          <circle class="trick-dot trick-dot-top" cx="8" cy="8" r="1"></circle>
          <circle class="trick-dot trick-dot-bottom" cx="24" cy="24" r="1"></circle>
        </svg>
      </button>
      <button class="key operator" type="button" data-key="÷">÷</button>

      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key operator" type="button" data-key="×">×</button>

      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key operator" type="button" data-key="−">−</button>

      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key operator" type="button" data-key="+">+</button>

      <button class="key parentheses" type="button" data-key="()">( )</button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key" type="button" data-key=".">.</button>
      <button class="key equals" type="button" data-key="=">=</button>
    </section>
  </main>

  <div id="selftest" role="status" aria-live="polite"></div>

  <script>
    function runSelfTests() {
      const failures = [];
      let assertions = 0;
      const assert = (cond, name) => {
        assertions += 1;
        if (!cond) failures.push(name);
      };

      const d = (str) => decFromString(str);
      const show = (a) => decToDisplay(a);
      assert(show(d("8.17")) === "8.17", "roundtrip 8.17");
      assert(show(d("-5")) === "-5", "roundtrip -5");
      assert(show(d("0817")) === "817", "display normalizes leading zero");
      assert(show(decAdd(d("0.1"), d("0.2"))) === "0.3", "0.1+0.2=0.3");
      assert(show(decSub(d("5"), d("7"))) === "-2", "5-7=-2");
      assert(show(decMul(d("1.5"), d("2"))) === "3", "1.5×2=3");
      assert(show(decMul(d("999999999999999"), d("999999999999999"))) === "9.99999999999998E29", "큰 곱셈 → 16자리 반올림 후 지수 표기");
      assert(show(d("999999999999.4")) === "999999999999.4", "1e16 미만은 십진 표시");
      assert(show(d("0.0000000009")) === "9E-10", "작은 쪽 지수 경계 유지");
      assert(show(decAdd(d("2.5"), d("2.5"))) === "5", "trailing zero removed");
      assert(decDiv(d("1"), d("0")) === null, "÷0 → null");
      assert(decDiv(d("0"), d("0")) === null, "0÷0 → null");
      assert(show(decDiv(d("1"), d("3"))) === "0.3333333333333333", "1÷3 유효16자리");
      assert(show(decDiv(d("2"), d("7"))) === "0.2857142857142857", "2÷7 순환소수 유효16자리");
      assert(show(decDiv(d("2"), d("3"))) === "0.6666666666666667", "2÷3 round-half-up 마지막 자리 7");
      assert(show(decDiv(d("10"), d("4"))) === "2.5", "10÷4 정확 종결");
      assert(show(decDiv(d("-1"), d("3"))) === "-0.3333333333333333", "부호 -+");
      assert(show(decDiv(d("-1"), d("-3"))) === "0.3333333333333333", "부호 --");
      assert(show(decDiv(d("1"), d("-3"))) === "-0.3333333333333333", "부호 +-");
      assert(show(decDiv(d("1"), d("0.0000000009"))) === "1111111111.111111", "0 근접 나눗셈(1.11e9 — 유효16자리 십진 표시)");
      assert(show(decDiv(d("1000000000000"), d("0.001"))) === "1000000000000000", "1e16 미만 큰 결과는 십진 표시");
      assert(decToPlainString(decFromString("1000000000000")) === "1000000000000", "fix2: plain 1e12");
      assert(decToPlainString(decFromString("-0.0000000009")) === "-0.0000000009", "fix2: plain small negative");
      assert(decToPlainString(decDiv(decFromString("1"),decFromString("3"))) === "0.333333333333333333333333333333", "fix2: plain 1/3 내부 30자리");
      assert(formatDisplay("931392") === "931,392", "쉼표: 정수");
      assert(formatDisplay("-1234.5678") === "-1,234.5678", "쉼표: 음수+소수부(소수부 미적용)");
      assert(formatDisplay("123") === "123", "쉼표: 3자리 이하 없음");
      assert(formatDisplay("1234567890123456") === "1,234,567,890,123,456", "쉼표: 16자리");
      assert(formatDisplay("1.234567891E15") === "1.234567891E15", "쉼표: 지수 표기 통과");
      assert(formatDisplay("오류") === "오류", "쉼표: 오류 통과");
      assert(formatDisplay("0.5") === "0.5", "쉼표: 소수만");

      // applyKey — 연산자·소수점·편집
      const seq = (keys, init="") => keys.reduce((e,k)=>applyKey(e,k), init);
      assert(seq(["5","+","×"]) === "5×", "연산자 교체");
      assert(seq(["5","+","+"]) === "5+", "같은 연산자 no-op");
      assert(seq(["5",".","5",".","5"]) === "5.55", "2번째 소수점 무시");
      assert(seq([".","5"]) === "0.5", "선두 . → 0.");
      assert(seq(["5","+","."]) === "5+0.", "연산자 직후 . → 0.");
      assert(seq(["+"]) === "", "빈 수식 이항연산자 무시");
      assert(seq(["÷"]) === "", "빈 수식 ÷ 무시");
      assert(seq(["−","5"]) === "-5", "빈 수식 − = 단항");
      assert(seq(["5","+","−","3"]) === "5+-3", "연산자 직후 − = 단항");
      assert(seq(["−","−","5"]) === "-5", "단항 − 연타 무시");
      assert(seq(["1","2","3","⌫"]) === "12", "백스페이스");
      assert(seq(["1","2","C"]) === "", "C 전체 클리어");
      assert(seq("1234567890123456".split("")) === "1234567890123456", "16자리 입력 허용");
      assert(seq("12345678901234567".split("")) === "1234567890123456", "17자리째 무시");
      assert(displayValue("123456789012÷") === "123456789012", "16자리 표시: 12자리 보존");
      assert(displayValue("1234567890123456×") === "1234567890123456", "16자리 표시: 16자리 보존");
      assert(seq(["()"]) === "", "() no-op");
      assert(seq(["5","()"]) === "5", "() no-op 2");
      // tokenize + evaluate
      const ev = (expr) => { const t = tokenize(expr); return t === null ? null : evaluate(t); };
      assert(show(ev(seq(["1","2","+","3","4","×","5"]))) === "230", "즉시계산: 12+34×5=230");
      assert(show(ev(seq(["9","×","9"]))) === "81", "9×9=81");
      assert(show(ev(seq("999999999999".split("").concat(["+","1"])))) === "1000000000000", "13자리 결과 십진 표시(지수 아님)");
      assert(displayValue("") === "0", "display: 빈 수식 0");
      assert(displayValue("9×9×") === "81", "display: 연산자 직후 중간결과 81");
      assert(displayValue("9×9×3") === "3", "display: 숫자 입력 중엔 그 숫자");
      assert(displayValue("12+34×") === "46", "display: 좌→우 중간결과 46");
      assert(displayValue("-5") === "-5", "display: 단항 음수 입력 중");
      assert(displayValue("7÷0×") === "오류", "display: ÷0 중간결과는 오류");
      assert(displayValue("50%") === "0.5", "display: % 적용값");
      assert(show(ev("(2+3)×4")) === "20", "괄호");
      assert(ev("7÷0") === null, "÷0 오류");
      assert(show(ev("5+")) === "5", "dangling 연산자 드롭");
      assert(show(ev("(2+3")) === "5", "미폐괄호 자동 닫기");
      assert(show(ev("50%")) === "0.5", "% 단항");
      assert(show(ev("200×10%")) === "20", "%는 즉시 적용");
      assert(show(ev("-5+3")) === "-2", "단항 − 평가");
      // soleNumberText
      assert(soleNumberText("817") === "817", "단일 숫자");
      assert(soleNumberText("-5") === "-5", "단항 − 단일 숫자");
      assert(soleNumberText("08.17") === "08.17", "리터럴 그대로(선행 0 보존)");
      assert(soleNumberText("1234567890123456") === "1234567890123456", "16자리 무장 판정 가능");
      assert(soleNumberText("12+34") === null, "연산자 있으면 null");
      assert(soleNumberText("(5)") === null, "괄호 있으면 null");
      assert(soleNumberText("") === null, "빈 수식 null");

      // trickStep
      const T0={phase:"off",storedText:null,lastKey:null,pendingSole:null};
      const st=(s,k,sole)=>trickStep(s,k,{soleNumberText:sole});
      let a=st(T0,"%","817");
      assert(a.action==="none","1번째 %는 평범");
      a=st(a.state,"%","8.17");
      assert(a.action==="set"&&a.state.phase==="set"&&a.state.storedText==="817","%% 세팅: 1번째 % 직전 리터럴 저장");
      let b=st(a.state,"3",null); b=st(b.state,"+",null); b=st(b.state,"5",null); b=st(b.state,"=",null);
      assert(b.action==="none"&&b.state.phase==="set"&&b.state.storedText==="817","set: 정상 계산 후에도 저장 유지");
      b=st(b.state,"1",null); b=st(b.state,"2",null); b=st(b.state,"×",null); b=st(b.state,"9",null); b=st(b.state,"=",null);
      assert(b.action==="none"&&b.state.phase==="set","set: 여러 계산에도 = 미카운트");
      let r=st(b.state,"%","108"); r=st(r.state,"%",null);
      assert(r.action==="arm"&&r.state.phase==="ready"&&r.state.storedText==="817","set에서 %% → ready, 저장값 보존");
      let c=st(r.state,"=",null);
      assert(c.action==="fire"&&c.state.phase==="off"&&c.state.storedText===null,"ready: =는 무조건 발동+초기화");
      // 보존
      let k=st(a.state,"C",null);
      assert(k.state.phase==="set"&&k.state.storedText==="817","C 보존");
      k=st(k.state,"⌫",null);
      assert(k.state.phase==="set","⌫ 보존");
      // ready에서 %% no-op
      let p=st(r.state,"%","55"); p=st(p.state,"%","0.55");
      assert(p.action==="none"&&p.state.phase==="ready"&&p.state.storedText==="817","ready에서 %% no-op");
      // 단일 숫자가 아닌 수식에서는 저장 안 됨
      let m=st(T0,"3",null); m=st(m.state,"+",null); m=st(m.state,"%",null); m=st(m.state,"%",null);
      assert(m.action==="none"&&m.state.phase==="off"&&m.state.storedText===null,"수식 중 %%는 저장 안 됨");
      // ÷는 무관
      let d0=st(T0,"÷","9"); d0=st(d0.state,"÷","9");
      assert(d0.state.phase==="off","÷÷는 이제 아무것도 안 함");
      // 비연속 %
      let n=st(T0,"%","9"); n=st(n.state,"5",null); n=st(n.state,"%",null);
      assert(n.state.phase==="off","% 사이 다른 키 = 세팅 안 됨");

      assert(show(ev(seq(["5","+","+","7"]))) === "12", "E2E5: 5++7=12");
      assert(show(ev(seq(["5","+"])))=== "5", "E2E7: 5+=5");
      assert(show(ev(seq(["5",".","5",".","5"]))) === "5.55", "E2E6: 5.5.5=5.55");
      assert(ev(seq(["7","÷","0"])) === null, "E2E4: 7÷0 오류");
      assert(show(ev(seq(["1","2","+","3","4","×","5"]))) === "230", "E2E1: 12+34×5=230");

      const panel = document.getElementById("selftest");
      const passed = failures.length === 0;
      const headline = passed
        ? `ALL PASS (${assertions} assertions)`
        : `FAIL (${failures.length}/${assertions})`;
      panel.className = passed ? "pass" : "fail";
      panel.textContent = passed
        ? headline
        : `${headline}\n${failures.map((name) => `- ${name}`).join("\n")}`;
      console[passed ? "log" : "error"](panel.textContent);
      return { assertions, failures };
    }

    function decPow10(exponent) {
      if (!Number.isInteger(exponent) || exponent < 0) {
        throw new RangeError("Decimal exponent must be a non-negative integer");
      }
      return 10n ** BigInt(exponent);
    }

    function decNormalize(sign, digits, scale) {
      let d = digits < 0n ? -digits : digits;
      let e = scale;

      if (d === 0n) return { s: 1, d: 0n, e: 0 };

      while (e > 0 && d % 10n === 0n) {
        d /= 10n;
        e -= 1;
      }

      return { s: sign < 0 ? -1 : 1, d, e };
    }

    function decFromString(str) {
      const source = String(str).trim();
      const match = /^([+\-−]?)(?:(\d+)(?:\.(\d*))?|\.(\d+))$/.exec(source);

      if (!match) {
        throw new TypeError(`Invalid decimal literal: ${source}`);
      }

      const sign = match[1] === "-" || match[1] === "−" ? -1 : 1;
      const integer = match[2] ?? "";
      const fraction = match[3] ?? match[4] ?? "";
      const digits = BigInt(`${integer}${fraction}` || "0");

      return decNormalize(sign, digits, fraction.length);
    }

    function decAdd(a, b) {
      const scale = Math.max(a.e, b.e);
      const left = BigInt(a.s) * a.d * decPow10(scale - a.e);
      const right = BigInt(b.s) * b.d * decPow10(scale - b.e);
      const sum = left + right;

      return decNormalize(sum < 0n ? -1 : 1, sum, scale);
    }

    function decSub(a, b) {
      return decAdd(a, { s: b.s * -1, d: b.d, e: b.e });
    }

    function decMul(a, b) {
      return decNormalize(a.s === b.s ? 1 : -1, a.d * b.d, a.e + b.e);
    }

    function decDiv(a, b) {
      if (b.d === 0n) return null;
      if (a.d === 0n) return decNormalize(1, 0n, 0);

      const digitDelta = a.d.toString().length - b.d.toString().length;
      const belowPower = digitDelta >= 0
        ? a.d < b.d * decPow10(digitDelta)
        : a.d * decPow10(-digitDelta) < b.d;
      const ratioExponent = belowPower ? digitDelta - 1 : digitDelta;
      const longDivisionPower = 30 - ratioExponent;
      const scaledNumerator = longDivisionPower >= 0
        ? a.d * decPow10(longDivisionPower)
        : a.d;
      const scaledDenominator = longDivisionPower >= 0
        ? b.d
        : b.d * decPow10(-longDivisionPower);
      const extendedQuotient = scaledNumerator / scaledDenominator;
      const guardDigit = extendedQuotient % 10n;
      let quotient = extendedQuotient / 10n;

      if (guardDigit >= 5n) {
        quotient += 1n;
      }

      const quotientExponent = ratioExponent + b.e - a.e;
      const resultScale = 29 - quotientExponent;
      const sign = a.s === b.s ? 1 : -1;

      return resultScale >= 0
        ? decNormalize(sign, quotient, resultScale)
        : decNormalize(sign, quotient * decPow10(-resultScale), 0);
    }

    function decToPlainString(dec) {
      const value = decNormalize(dec.s, dec.d, dec.e);
      if (value.d === 0n) return "0";

      const digits = value.d.toString();
      const sign = value.s < 0 ? "-" : "";
      const decimalPosition = digits.length - value.e;

      if (decimalPosition <= 0) {
        return `${sign}0.${"0".repeat(-decimalPosition)}${digits}`;
      }
      if (decimalPosition >= digits.length) {
        return `${sign}${digits}${"0".repeat(decimalPosition - digits.length)}`;
      }
      return `${sign}${digits.slice(0, decimalPosition)}.${digits.slice(decimalPosition)}`;
    }

    const DISPLAY_SIG = 16;

    function decToDisplay(dec) {
      const value = decNormalize(dec.s, dec.d, dec.e);
      if (value.d === 0n) return "0";

      const rawDigits = value.d.toString();
      let exponent = rawDigits.length - value.e - 1;
      let roundedDigits = value.d;

      if (rawDigits.length > DISPLAY_SIG) {
        const cut = rawDigits.length - DISPLAY_SIG;
        const divisor = decPow10(cut);
        const remainder = roundedDigits % divisor;
        roundedDigits /= divisor;

        if (remainder * 2n >= divisor) {
          roundedDigits += 1n;
        }

        if (roundedDigits.toString().length > DISPLAY_SIG) {
          roundedDigits /= 10n;
          exponent += 1;
        }
      }

      const significant = roundedDigits.toString().replace(/0+$/, "");
      const sign = value.s < 0 ? "-" : "";
      const useExponent = exponent >= 16 || exponent < -9;

      if (useExponent) {
        const mantissa = significant.length === 1
          ? significant
          : `${significant[0]}.${significant.slice(1)}`;
        return `${sign}${mantissa}E${exponent}`;
      }

      const decimalPosition = exponent + 1;
      if (decimalPosition <= 0) {
        return `${sign}0.${"0".repeat(-decimalPosition)}${significant}`;
      }
      if (decimalPosition >= significant.length) {
        return `${sign}${significant}${"0".repeat(decimalPosition - significant.length)}`;
      }
      return `${sign}${significant.slice(0, decimalPosition)}.${significant.slice(decimalPosition)}`;
    }

    function expressionTokenCount(expr) {
      let count = 0;
      let index = 0;

      while (index < expr.length) {
        if (expr[index] === "-" && /[\d.]/.test(expr[index + 1] ?? "")) {
          index += 1;
        }

        if (/[\d.]/.test(expr[index] ?? "")) {
          while (index < expr.length && /[\d.]/.test(expr[index])) index += 1;
        } else {
          index += 1;
        }
        count += 1;
      }

      return count;
    }

    function applyKey(expr, key) {
      const source = String(expr ?? "");
      const acceptedKeys = /^(?:[0-9]|\.|\+|−|×|÷|\(\)|%|C|⌫)$/;

      if (!acceptedKeys.test(key)) return source;
      if (key === "C") return "";
      if (key === "⌫") return source.slice(0, -1);

      const withinTokenLimit = (candidate) =>
        expressionTokenCount(candidate) <= 100 ? candidate : source;
      const last = source.at(-1) ?? "";
      const binaryOperators = "+−×÷";
      const expectsOperand =
        source === "" || binaryOperators.includes(last) || last === "(" || last === "-";

      if (/^\d$/.test(key)) {
        const currentNumber = /[\d.]+$/.exec(source)?.[0] ?? "";
        const digitCount = (currentNumber.match(/\d/g) ?? []).length;
        if (digitCount >= 16) return source;
        return withinTokenLimit(source + key);
      }

      if (key === ".") {
        if (expectsOperand) return withinTokenLimit(`${source}0.`);
        const currentNumber = /[\d.]+$/.exec(source)?.[0] ?? "";
        if (currentNumber === "" || currentNumber.includes(".")) return source;
        return withinTokenLimit(`${source}.`);
      }

      if (key === "()") {
        return source;
      }

      if (key === "%") {
        return /[\d.)%]/.test(last) ? withinTokenLimit(`${source}%`) : source;
      }

      if (key === "−") {
        if (expectsOperand) {
          return last === "-" ? source : withinTokenLimit(`${source}-`);
        }
        return withinTokenLimit(`${source}−`);
      }

      if (source === "" || last === "(" || last === "-") return source;
      if (binaryOperators.includes(last)) {
        return last === key
          ? source
          : withinTokenLimit(`${source.slice(0, -1)}${key}`);
      }
      return withinTokenLimit(`${source}${key}`);
    }

    function tokenize(expr) {
      const source = String(expr ?? "");
      const tokens = [];
      let index = 0;
      let openCount = 0;
      let expectsOperand = true;
      const push = (token) => {
        tokens.push(token);
        return tokens.length <= 100;
      };

      while (index < source.length) {
        const char = source[index];

        if (expectsOperand && (char === "-" || char === "−")) {
          if (source[index + 1] === "(") {
            if (!push({ t: "num", v: "-1" }) || !push({ t: "op", v: "*" })) {
              return null;
            }
            index += 1;
            continue;
          }
          const numberMatch = /^(?:\d+(?:\.\d*)?|\.\d+)/.exec(source.slice(index + 1));
          if (!numberMatch || !push({ t: "num", v: `-${numberMatch[0]}` })) return null;
          index += numberMatch[0].length + 1;
          expectsOperand = false;
          continue;
        }

        if (/[\d.]/.test(char)) {
          if (!expectsOperand) return null;
          const numberMatch = /^(?:\d+(?:\.\d*)?|\.\d+)/.exec(source.slice(index));
          if (!numberMatch || !push({ t: "num", v: numberMatch[0] })) return null;
          index += numberMatch[0].length;
          expectsOperand = false;
          continue;
        }

        if (char === "(") {
          if (!expectsOperand || !push({ t: "lp" })) return null;
          openCount += 1;
          index += 1;
          continue;
        }

        if (char === ")") {
          if (expectsOperand || openCount === 0 || !push({ t: "rp" })) return null;
          openCount -= 1;
          index += 1;
          expectsOperand = false;
          continue;
        }

        if (char === "%") {
          if (expectsOperand || !push({ t: "pct" })) return null;
          index += 1;
          continue;
        }

        const mappedOperator = {
          "+": "+",
          "−": "-",
          "×": "*",
          "÷": "/"
        }[char];
        if (mappedOperator) {
          if (expectsOperand || !push({ t: "op", v: mappedOperator })) return null;
          index += 1;
          expectsOperand = true;
          continue;
        }

        return null;
      }

      return tokens;
    }

    function evaluate(tokens) {
      if (!Array.isArray(tokens) || tokens.length === 0 || tokens.length > 100) return null;

      const prepared = tokens.map((token) => ({ ...token }));
      while (prepared.at(-1)?.t === "op") prepared.pop();
      if (prepared.length === 0) return null;

      let balance = 0;
      for (const token of prepared) {
        if (token.t === "lp") balance += 1;
        if (token.t === "rp") {
          balance -= 1;
          if (balance < 0) return null;
        }
      }
      while (balance > 0) {
        prepared.push({ t: "rp" });
        balance -= 1;
      }

      const values = [];
      const operators = [];
      const precedence = { "+": 1, "-": 1, "*": 1, "/": 1 };
      const hundred = decFromString("100");
      let expectsOperand = true;

      const applyTopOperator = () => {
        const operator = operators.pop();
        if (!operator || operator === "(" || values.length < 2) return false;
        const right = values.pop();
        const left = values.pop();
        const result = operator === "+"
          ? decAdd(left, right)
          : operator === "-"
            ? decSub(left, right)
            : operator === "*"
              ? decMul(left, right)
              : decDiv(left, right);
        if (result === null) return false;
        values.push(result);
        return true;
      };

      for (const token of prepared) {
        if (token.t === "num") {
          if (!expectsOperand || typeof token.v !== "string") return null;
          try {
            values.push(decFromString(token.v));
          } catch {
            return null;
          }
          expectsOperand = false;
          continue;
        }

        if (token.t === "pct") {
          if (expectsOperand || values.length === 0) return null;
          const percentage = decDiv(values.pop(), hundred);
          if (percentage === null) return null;
          values.push(percentage);
          continue;
        }

        if (token.t === "lp") {
          if (!expectsOperand) return null;
          operators.push("(");
          continue;
        }

        if (token.t === "rp") {
          if (expectsOperand) return null;
          while (operators.length > 0 && operators.at(-1) !== "(") {
            if (!applyTopOperator()) return null;
          }
          if (operators.pop() !== "(") return null;
          expectsOperand = false;
          continue;
        }

        if (token.t === "op" && Object.hasOwn(precedence, token.v)) {
          if (expectsOperand) return null;
          while (
            operators.length > 0 &&
            operators.at(-1) !== "(" &&
            precedence[operators.at(-1)] >= precedence[token.v]
          ) {
            if (!applyTopOperator()) return null;
          }
          operators.push(token.v);
          expectsOperand = true;
          continue;
        }

        return null;
      }

      if (expectsOperand) return null;
      while (operators.length > 0) {
        if (operators.at(-1) === "(" || !applyTopOperator()) return null;
      }
      return values.length === 1 ? values[0] : null;
    }

    function displayValue(expr) {
      const source = String(expr ?? "");
      if (source === "") return "0";

      if (/^-?(?:\d+(?:\.\d*)?|\.\d+)(?:E-?\d+)?$/.test(source)) {
        return source;
      }

      const trailingNumber =
        /(?:^|[+−×÷(])(-?(?:\d+(?:\.\d*)?|\.\d+))$/.exec(source);
      if (trailingNumber) return trailingNumber[1];

      let evaluable = source;
      const last = source.at(-1);
      if ("+−×÷".includes(last)) {
        evaluable = source.slice(0, -1);
      } else if (last === "-") {
        evaluable = source.slice(0, -1);
        if (evaluable === "") return "0";
      }

      const tokens = tokenize(evaluable);
      const value = tokens === null ? null : evaluate(tokens);
      return value === null ? "오류" : decToDisplay(value);
    }

    function formatDisplay(str) {
      const source = String(str ?? "");
      if (source === "오류" || source.includes("E")) return source;

      const number = /^(-?)(\d+)(\.\d*)?$/.exec(source);
      if (number === null) return source;

      const [, sign, integer, fraction = ""] = number;
      const grouped = integer.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return `${sign}${grouped}${fraction}`;
    }

    function soleNumberText(expr) {
      const source = String(expr ?? "");
      return /^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(source) ? source : null;
    }

    function trickStep(state, key, exprInfo) {
      const current = {
        phase: ["off", "set", "ready"].includes(state?.phase)
          ? state.phase
          : "off",
        storedText: typeof state?.storedText === "string" ? state.storedText : null,
        lastKey: state?.lastKey ?? null,
        pendingSole: typeof state?.pendingSole === "string" ? state.pendingSole : null
      };
      const next = { ...current, lastKey: key };

      if (
        key === "%" &&
        current.lastKey === "%" &&
        current.phase === "set"
      ) {
        return {
          state: {
            ...next,
            phase: "ready",
            pendingSole: null
          },
          action: "arm"
        };
      }

      if (
        key === "%" &&
        current.lastKey === "%" &&
        current.phase === "off" &&
        current.pendingSole !== null
      ) {
        return {
          state: {
            ...next,
            phase: "set",
            storedText: current.pendingSole,
            pendingSole: null
          },
          action: "set"
        };
      }

      if (key === "%") {
        return {
          state: {
            ...next,
            pendingSole:
              typeof exprInfo?.soleNumberText === "string"
                ? exprInfo.soleNumberText
                : null
          },
          action: "none"
        };
      }

      if (key === "=" && current.phase === "ready") {
        return {
          state: {
            phase: "off",
            storedText: null,
            lastKey: null,
            pendingSole: null
          },
          action: "fire"
        };
      }

      return {
        state: { ...next, pendingSole: null },
        action: "none"
      };
    }

    function isPrimaryPointer(event) {
      return (
        event.isPrimary !== false &&
        (event.button === undefined || event.button === 0)
      );
    }

    function fitDisplayText(display) {
      display.style.removeProperty("font-size");
      const textLength = display.textContent?.length ?? 0;
      const naturalStyle = getComputedStyle(display);
      const naturalSize = Number.parseFloat(naturalStyle.fontSize);
      const lengthScale =
        textLength <= 10 ? 1 :
        textLength <= 16 ? 0.82 :
        textLength <= 24 ? 0.64 :
        textLength <= 36 ? 0.48 : 0.36;
      let fittedSize = naturalSize * lengthScale;
      display.style.fontSize = `${fittedSize}px`;

      const fittedStyle = getComputedStyle(display);
      const availableWidth =
        display.clientWidth -
        Number.parseFloat(fittedStyle.paddingLeft) -
        Number.parseFloat(fittedStyle.paddingRight);
      const canvas =
        fitDisplayText.canvas ??
        (fitDisplayText.canvas = document.createElement("canvas"));
      const context = canvas.getContext("2d");

      if (context !== null && availableWidth > 0) {
        context.font =
          `${fittedStyle.fontStyle} ${fittedStyle.fontWeight} ` +
          `${fittedSize}px ${fittedStyle.fontFamily}`;
        const letterSpacing = Number.parseFloat(fittedStyle.letterSpacing) || 0;
        const measuredWidth =
          context.measureText(display.textContent ?? "").width +
          Math.max(0, textLength - 1) * letterSpacing;

        if (measuredWidth > availableWidth) {
          fittedSize *= (availableWidth / measuredWidth) * 0.98;
          display.style.fontSize = `${Math.max(1, fittedSize)}px`;
        }
      }
    }

    function setupCalculator() {
      const display = document.getElementById("display");
      const keypad = document.querySelector(".keypad");
      const percentKey = keypad.querySelector('[data-key="%"]');
      let expr = "";
      let resultShown = false;
      let lastResult = null;
      let errorShown = false;
      let trickState = {
        phase: "off",
        storedText: null,
        lastKey: null,
        pendingSole: null
      };

      const render = () => {
        const rawDisplay = errorShown ? "오류" : displayValue(expr);
        display.textContent = formatDisplay(rawDisplay);
        percentKey.classList.toggle("trick-set", trickState.phase === "set");
        percentKey.classList.toggle("trick-ready", trickState.phase === "ready");
        fitDisplayText(display);
      };

      const handleKey = (key) => {
        const readyWillFire = key === "=" && trickState.phase === "ready";
        const setPercent = key === "%" && trickState.phase === "set";
        if (errorShown && key !== "C" && !readyWillFire && !setPercent) return;

        if (key === "%") {
          const transition = trickStep(
            trickState,
            key,
            { soleNumberText: soleNumberText(expr) }
          );
          trickState = transition.state;

          if (transition.action === "set") {
            expr = "";
            resultShown = false;
            lastResult = null;
            errorShown = false;
            render();
            return;
          }
          if (transition.action === "arm") {
            render();
            return;
          }
          if (errorShown) {
            render();
            return;
          }
        } else if (key === "=") {
          const storedBeforeStep = trickState.storedText;

          if (trickState.phase === "ready") {
            const transition = trickStep(
              trickState,
              key,
              { soleNumberText: null }
            );
            trickState = transition.state;

            if (transition.action === "fire") {
              expr = storedBeforeStep ?? "";
              resultShown = true;
              lastResult = expr === "" ? null : decFromString(expr);
              errorShown = false;
              render();
              return;
            }
          }

          if (expr !== "" && !resultShown) {
            const tokens = tokenize(expr);
            const value = tokens === null ? null : evaluate(tokens);

            if (value === null) {
              errorShown = true;
              resultShown = false;
              lastResult = null;
            } else {
              expr = decToDisplay(value);
              resultShown = true;
              lastResult = value;
            }
          }

          const transition = trickStep(
            trickState,
            key,
            { soleNumberText: null }
          );
          trickState = transition.state;
          render();
          return;
        } else {
          const transition = trickStep(
            trickState,
            key,
            { soleNumberText: null }
          );
          trickState = transition.state;
        }

        if (key === "C") {
          expr = "";
          resultShown = false;
          lastResult = null;
          errorShown = false;
          render();
          return;
        }

        if (key === "⌫" && resultShown) {
          expr = "";
          resultShown = false;
          lastResult = null;
          render();
          return;
        }

        if (resultShown) {
          if (/^(?:[0-9]|\.|\(\))$/.test(key)) {
            expr = "";
          } else if (lastResult !== null) {
            expr = decToPlainString(lastResult);
          }
          resultShown = false;
          lastResult = null;
        }

        expr = applyKey(expr, key);
        if ("+−×÷".includes(key) && displayValue(expr) === "오류") {
          errorShown = true;
          resultShown = false;
          lastResult = null;
        }
        render();
      };

      keypad.addEventListener("pointerdown", (event) => {
        if (!isPrimaryPointer(event)) return;
        const button = event.target.closest("button[data-key]");
        if (!button || !keypad.contains(button)) return;

        event.preventDefault();
        button.classList.add("pressed");
        window.setTimeout(() => button.classList.remove("pressed"), 140);
        handleKey(button.dataset.key);
      });

      window.addEventListener("resize", () => fitDisplayText(display));
      render();
    }

    let wakeLock = null;
    let wakeLockPending = false;

    async function acquireWakeLock() {
      if (
        !("wakeLock" in navigator) ||
        document.visibilityState !== "visible" ||
        wakeLock !== null ||
        wakeLockPending
      ) {
        return;
      }

      wakeLockPending = true;
      try {
        const lock = await navigator.wakeLock.request("screen");

        if (document.visibilityState !== "visible") {
          await lock.release();
          return;
        }

        wakeLock = lock;
        lock.addEventListener("release", () => {
          if (wakeLock === lock) wakeLock = null;
          if (document.visibilityState === "visible") acquireWakeLock();
        }, { once: true });
      } catch {
        wakeLock = null;
      } finally {
        wakeLockPending = false;
      }
    }

    async function releaseWakeLock() {
      const lock = wakeLock;
      wakeLock = null;
      if (lock === null) return;

      try {
        await lock.release();
      } catch {
        // Wake Lock API is optional; release failures need no UI.
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        acquireWakeLock();
      } else {
        releaseWakeLock();
      }
    });

    if (location.hash === "#selftest") {
      document.getElementById("app").hidden = true;
      const panel = document.getElementById("selftest");
      panel.style.display = "block";
      runSelfTests();
    } else {
      setupCalculator();
      acquireWakeLock();
    }
  </script>
  <style>
    #install-nudge {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #1c1c1e;
      color: #fff;
      border-radius: 14px;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    #install-nudge span { flex: 1; }
    #install-nudge button {
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 14px;
      background: #ff9f0a;
      color: #000;
    }
    #install-nudge button[data-act="close"] {
      background: transparent;
      color: #8e8e93;
      padding: 8px;
    }
  </style>
  <script>
    (() => {
      try {
        const KEY = "installNudgeDone";
        if (localStorage.getItem(KEY)) return;
        const standalone = typeof window.matchMedia === "function" &&
          window.matchMedia("(display-mode: standalone)").matches;
        if (standalone || navigator.standalone) return;

        let deferred = null;
        let bar = null;
        const done = () => {
          try { localStorage.setItem(KEY, "1"); } catch (_) {}
          if (bar) bar.remove();
          bar = null;
          deferred = null;
        };

        window.addEventListener("appinstalled", done);
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          deferred = event;
          if (bar) return;

          bar = document.createElement("div");
          bar.id = "install-nudge";
          bar.innerHTML = '<span>홈 화면에 앱으로 설치할 수 있어요</span>' +
            '<button type="button" data-act="install">설치</button>' +
            '<button type="button" data-act="close" aria-label="닫기">✕</button>';
          bar.addEventListener("pointerdown", (event) => event.stopPropagation());
          bar.addEventListener("click", async (event) => {
            event.stopPropagation();
            const button = event.target.closest("button[data-act]");
            const act = button ? button.dataset.act : null;
            if (act === "install" && deferred) {
              const promptEvent = deferred;
              deferred = null;
              try {
                promptEvent.prompt();
                await promptEvent.userChoice;
              } catch (_) {}
              done();
            } else if (act === "close") {
              done();
            }
          });
          document.body.appendChild(bar);
        });
      } catch (_) {}
    })();
  </script>
</body>
