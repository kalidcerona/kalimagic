<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입문 강의 영상 - 칼리형</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        .members-header {
            padding: 60px 24px 20px;
            text-align: center;
        }

        .members-logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--point-gold);
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .members-title {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .members-sub {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .members-divider {
            width: 48px;
            height: 2px;
            background: var(--point-gold);
            margin: 20px auto 0;
            border-radius: 2px;
        }

        .video-list {
            max-width: 780px;
            margin: 0 auto;
            padding: 40px 24px 80px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .video-item {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }

        .video-item:hover {
            border-color: rgba(201, 168, 76, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .video-meta {
            padding: 16px 20px 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .video-num {
            background: var(--point-gold);
            color: #121212;
            font-weight: 800;
            font-size: 0.85rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .video-label {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .video-wrapper {
            position: relative;
            padding-top: 56.25%;
            margin: 12px 0 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-coming {
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            font-size: 0.95rem;
            gap: 8px;
            margin: 12px 0 0;
        }

        .video-coming-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.4;
        }

        @media (max-width: 480px) {
            .video-list {
                padding: 24px 16px 60px;
                gap: 28px;
            }
            .members-header {
                padding: 48px 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="members-header fade-in">
        <div class="members-logo">KALI</div>
        <h1 class="members-title">입문 강의 영상</h1>
        <p class="members-sub">구매해줘서 고마워. 천천히, 여러 번 봐.</p>
        <div class="members-divider"></div>
    </div>

    <div class="video-list">

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">1</div>
                <div class="video-label">마술 이론</div>
            </div>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/D2Zn5KzT6SA?si=wo5tUzqJ4geJo_9y"
                    title="입문 강의 1 - 마술 이론"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">2</div>
                <div class="video-label">이론</div>
            </div>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/5Q9q7zQzu1o"
                    title="입문 강의 2 - 이론"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">3</div>
                <div class="video-label">카드 기본기</div>
            </div>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/bCiFJDVZCyw"
                    title="입문 강의 3 - 카드 기본기"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">4</div>
                <div class="video-label">맥박 카드 마술</div>
            </div>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/D2hJ5G8wTt4"
                    title="입문 강의 4 - 맥박 카드 마술"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">5</div>
                <div class="video-label">초직감 카드 마술</div>
            </div>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/j9rfE_aAmN0"
                    title="입문 강의 5 - 초직감 카드 마술"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">6</div>
                <div class="video-label">순간이동 카드 마술</div>
            </div>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/RpPBJNGS89g"
                    title="입문 강의 6 - 순간이동 카드 마술"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">7</div>
                <div class="video-label">넵킨 리스토어</div>
            </div>
            <div class="video-coming">
                <div class="video-coming-dot"></div>
                <div class="video-coming-dot"></div>
                <div class="video-coming-dot"></div>
                <span>영상 준비 중</span>
            </div>
        </div>

        <div class="video-item fade-in">
            <div class="video-meta">
                <div class="video-num">8</div>
                <div class="video-label">마무리</div>
            </div>
            <div class="video-coming">
                <div class="video-coming-dot"></div>
                <div class="video-coming-dot"></div>
                <div class="video-coming-dot"></div>
                <span>영상 준비 중</span>
            </div>
        </div>

    </div>

    <section style="padding: 40px 24px 80px;">
        <div class="container">
            <div class="secondary-cta-box" style="max-width: 700px; margin: 0 auto;">
                <h2 style="font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 700; line-height: 1.5; margin-bottom: 40px; word-break: keep-all;">강의 마음에 들었으면 다음 단계가 있어<br>형이랑 직접 해보자</h2>
                <a href="lesson.html" class="cta-button">칼리형한테 레슨 신청하기 →</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
