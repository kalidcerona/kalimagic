[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/tools/*"
  function = "tools-gate"

[[edge_functions]]
  path = "/tools"
  function = "tools-gate"

[[redirects]]
  from = "/api/seminars/offer"
  to = "/.netlify/functions/seminar-offer"
  status = 200

[[redirects]]
  from = "/api/seminars/signup"
  to = "/.netlify/functions/seminar-signup"
  status = 200

[[redirects]]
  from = "/tools/_check"
  to = "/.netlify/functions/tool-check"
  status = 200

[[redirects]]
  from = "/p"
  to = "/playground.html"
  status = 200
  force = true

[[redirects]]
  from = "/p/:id"
  to = "/playground.html"
  status = 200
  force = true

[[redirects]]
  from = "/post"
  to = "/playground.html"
  status = 200
  force = true

[[redirects]]
  from = "/write"
  to = "/playground.html"
  status = 200
  force = true

[[redirects]]
  from = "/playground"
  to = "/playground.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"





