[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[functions.post-og]
  included_files = ["post.html"]

[[edge_functions]]
  path = "/tools/*"
  function = "tools-gate"

[[edge_functions]]
  path = "/tools"
  function = "tools-gate"

[[redirects]]
  from = "/tools/_check"
  to = "/.netlify/functions/tool-check"
  status = 200

[[redirects]]
  from = "/post.html"
  to = "/p/:id"
  status = 301
  force = true
  query = { id = ":id" }

[[redirects]]
  from = "/p/:id"
  to = "/.netlify/functions/post-og?id=:id"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/zz10"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/zz10/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/tools/hitsuzen/manifest.webmanifest"
