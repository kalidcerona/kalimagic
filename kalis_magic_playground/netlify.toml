# Exact legacy worker scripts. force=true splat rules below must not catch these.
# Destinations live outside /tools so the edge gate does not run again.

[[redirects]]
  from = "/tools/stopwatch/sw.js"
  to = "/legacy-bridges/stopwatch/sw.js"
  status = 200
  force = true

[[redirects]]
  from = "/tools/stopwatch-uni/sw.js"
  to = "/legacy-bridges/stopwatch-uni/sw.js"
  status = 200
  force = true

[[redirects]]
  from = "/tools/calc/sw.js"
  to = "/legacy-bridges/calc/sw.js"
  status = 200
  force = true

[[redirects]]
  from = "/tools/calc/*"
  to = "/tools/hitsuzen/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tools/calc"
  to = "/tools/hitsuzen/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/unlock/*"
  to = "/tools/release/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tools/unlock"
  to = "/tools/release/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/stopwatch-uni/*"
  to = "/tools/kairos/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tools/stopwatch-uni"
