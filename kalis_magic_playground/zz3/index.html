<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>HITSUZEN</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./settings-ui.css">
  <script src="./settings-ui.js" defer></script>
  <script src="./performance-link.js" defer></script>
</head>
<body data-magic-app="calculator">
  <main class="calculator" id="app" aria-label="계산기">
    <div class="toolbar" aria-hidden="true">
      <span class="toolbar-icon">
        <svg id="clock-icon" viewBox="0 0 24 24">
          <path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7"></path>
          <path d="M3.5 4.5v4h4"></path>
          <path d="M12 7.5V12l3 2"></path>
        </svg>
      </span>
      <span class="toolbar-tools">
        <svg id="pen-icon" viewBox="0 0 24 24">
          <path d="m5 18 12-12 2 2L7 20H5v-2Z"></path>
          <path d="m11 12 2 2m1-5 2 2m-8 4 2 2"></path>
        </svg>
        <span class="root-mark" id="stack-icon">√</span>
      </span>
    </div>

    <div class="date-settings" id="date-settings" data-settings-root aria-hidden="true">
      <img class="date-settings-logo" src="brand-logo.jpg" alt="HITSUZEN">
      <header id="settings-header"><div class="header-lead"><span class="eyebrow">히츠젠 / 설정</span><h1 id="settings-title">설정</h1></div></header>
      <div class="identity">
        <div class="identity-copy"><span class="catalog-label">필연</span><p class="identity-name">HITSUZEN</p><p class="identity-desc">과정이 이미 품고 있던 하나의 결론.</p></div>
        <svg class="sig" viewBox="0 0 120 80" aria-hidden="true" focusable="false"><path class="ink" pathLength="100" d="M8 18C36 18 78 40 108 40"/><path class="ink" pathLength="100" d="M8 40H108"/><path class="ink" pathLength="100" d="M8 62C36 62 78 40 108 40"/><path class="accent" d="M108 30v20"/></svg>
      </div>
      <p class="setting-intro">설정 열기: 화면에서 두 손가락을 아래로 쓸어내리세요.</p>
      <p class="desktop-settings-help">PC에서는 설정 버튼이나 Shift+Esc를 사용하세요.</p>
      <div class="body-groups">
      <details data-settings-group="date"><summary>날짜 리빌 · 시간 설정</summary>
      <div class="date-settings-controls">
      <button type="button" data-date-action="decrease">−</button>
      <span class="date-settings-value" id="date-delay-value">20초</span>
      <button type="button" data-date-action="increase">+</button>
      <button type="button" data-date-action="hour-cycle" id="date-hour-cycle">24h</button>
      </div></details>
      <details data-settings-group="appearance"><summary>화면 모양</summary><div class="date-settings-controls">
      <button type="button" data-date-action="skin" id="skin-toggle">스킨: 기본</button>
      </div></details>
      <details data-settings-group="release"><summary>RELEASE에서 받은 일수</summary>
      <p id="release-days-value">아직 받은 값이 없어요.</p>
      <p>%를 두 번 누르면 준비되고, =를 누르면 받은 일수가 나타나요.</p>
      <button type="button" data-date-action="release-clear" id="release-days-clear" disabled>받은 일수 지우기</button>
      </details>
      </div>
      <button type="button" data-date-action="close">닫기</button>
    </div>

    <div class="display-wrap">
      <span id="stack-result" hidden></span>
      <output class="display" id="display" aria-live="polite">0</output>
    </div>

    <section class="keypad" aria-label="계산기 키패드">
      <button class="key utility" type="button" data-key="C">C</button>
      <button class="key utility backspace" type="button" data-key="⌫" aria-label="지우기">⌫</button>
      <button class="key sign" type="button" data-key="±" aria-label="부호 전환">±</button>
      <button class="key operator" type="button" data-key="%" aria-label="퍼센트">
        <svg class="percent-glyph" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="percent-mark" cx="8" cy="8" r="4.25"></circle>
          <path class="percent-mark" d="M8 25 24 7"></path>
          <circle class="percent-mark" cx="24" cy="24" r="4.25"></circle>
          <circle class="trick-dot trick-dot-top" cx="8" cy="8" r="1"></circle>
          <circle class="trick-dot trick-dot-bottom" cx="24" cy="24" r="1"></circle>
        </svg>
      </button>
      <button class="key operator" type="button" data-key="÷">÷</button>

      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key operator" type="button" data-key="×">×</button>

      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key operator" type="button" data-key="−">−</button>

      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key operator" type="button" data-key="+">+</button>

      <button class="key parentheses" type="button" data-key="()">( )</button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key" type="button" data-key=".">.</button>
      <button class="key equals" type="button" data-key="=">=</button>
    </section>
  </main>

  <div id="settings-entry-tutorial" role="dialog" aria-label="설정 여는 방법" hidden>
    <div class="tutorial-card"><div class="tutorial-fingers" aria-hidden="true"><span></span><span></span></div><p>설정을 열려면 두 손가락으로 화면을 아래로 쓸어내리세요.</p><p class="desktop-settings-help">PC에서는 화면의 ‘설정’ 버튼이나 Shift+Esc를 사용하세요.</p><button id="settings-entry-tutorial-dismiss" type="button">알겠어요</button></div>
  </div>
  <button id="desktop-settings-entry" class="desktop-settings-entry" type="button" aria-label="PC 설정 열기, Shift+Escape" hidden>설정 · Shift+Esc</button>
  <div id="selftest" role="status" aria-live="polite"></div>

  <script src="./settings-swipe.js"></script>
  <script src="./selftest.js"></script>
  <script src="./cards.js"></script>
  <script src="./decimal.js"></script>
  <script src="./expression.js"></script>
  <script src="./tricks.js"></script>
  <script src="./ui-helpers.js"></script>
  <script src="./settings-tutorial.js"></script>
  <script src="./update-prompt.js"></script>
  <script src="./app.js"></script>
  <script src="./wake-lock.js"></script>
  <script src="./boot.js"></script>
  <link rel="stylesheet" href="./install-nudge.css">
  <script src="./install-nudge.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.hash !== "#selftest") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
  <script>
    var m = location.pathname.match(/^\/tools\/([a-z0-9-]+)/);
    if (m && location.hash !== "#selftest") {
      // 권한이 회수됐는지 조용히 확인. 회수됐으면 캐시를 비우고 새로고침해 로그인으로 보낸다.
      setTimeout(function () {
        try {
          if (!navigator.onLine) return;
          fetch("/tools/_check?tool=" + (m[1] === "hitsuzen" ? "calc" : m[1]), { credentials: "same-origin", cache: "no-store" })
            .then(function (response) { return response.json(); })
            .then(function (result) {
              if (!result || result.ok !== false || result.reason !== "revoked") return;
              return caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) {
                  return name.indexOf("kali-") === 0 ? caches.delete(name) : null;
                }));
              }).then(function () { location.reload(); });
            })
            .catch(function () {});
        } catch (error) {
          // 확인 실패는 앱 동작에 영향을 주지 않는다.
        }
      }, 4000);
    }
  </script>
</body>
</html>
