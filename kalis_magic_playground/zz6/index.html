<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Stopwatch</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, "SF Pro Display", system-ui, Roboto, sans-serif; background: #000; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #000; color: #fff; }
    [hidden] { display: none !important; }
    button { appearance: none; -webkit-appearance: none; border: 0; padding: 0; outline: none; color: inherit; font: inherit; }
    #shell { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #000; }
    .mode-view { position: absolute; inset: 0; overflow: hidden; }

    /* Portrait: v2 iOS Clock surface. */
    #portrait-app { background: #000; }
    #p-top-band { position: absolute; top: env(safe-area-inset-top); left: 0; right: 0; height: 22%; touch-action: none; }
    #p-time-display { position: absolute; top: 30%; left: 15%; width: 70%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: min(18vw, 9.6dvh); font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; touch-action: none; }
    #p-numeric-display { display: flex; align-items: baseline; }
    .p-digits { display: inline-flex; }
    #p-time-display [data-p-digit] { display: inline-block; width: 0.56em; border-radius: 0.12em; text-align: center; touch-action: none; transition: background-color 120ms ease, color 120ms ease; }
    #portrait-app.preset-mode [data-p-digit].selected { background: #fff; color: #000; }
    #p-minutes { letter-spacing: -0.045em; }
    .colon { display: inline-flex; align-self: center; flex-direction: column; justify-content: space-between; align-items: center; width: 0.22em; height: 0.40em; margin: 0 0.025em; transform: translateY(0.025em); }
    .colon-dot { width: 0.1em; height: 0.1em; border-radius: 50%; background: #fff; }
    .colon.trick .colon-dot:first-child { opacity: 0.82; }
    .colon.trick-text .colon-dot { opacity: 0.6; }
    #portrait-app.preset-mode .colon-dot, #landscape-app.preset-mode .colon-dot { opacity: 0; }
    #p-decimal { width: 0.20em; text-align: center; }
    #p-custom-display { display: block; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #p-buttons { position: absolute; top: 50%; left: 8vw; right: 8vw; transform: translateY(-50%); display: flex; align-items: center; justify-content: space-between; }
    .round { width: clamp(3.75rem, 18vw, 4.75rem); height: clamp(3.75rem, 18vw, 4.75rem); border-radius: 50%; font-size: clamp(0.875rem, 4.25vw, 1.0625rem); font-weight: 400; }
    #p-lap { background: #2c2c2e; }
    #p-lap:disabled { color: #8e8e93; }
    #p-control { background: #0a2e14; color: #30d158; }
    #p-control.running { background: #3a0a0a; color: #ff453a; }
    #p-pages { display: flex; gap: clamp(0.25rem, 1.5vw, 0.5rem); }
    #p-pages i { width: clamp(0.3rem, 1.5vw, 0.42rem); height: clamp(0.3rem, 1.5vw, 0.42rem); border-radius: 50%; background: #48484a; }
    #p-pages i:first-child { background: #fff; }
    #p-lap-area { position: absolute; top: calc(50% + clamp(1.875rem, 9vw, 2.375rem) + 2dvh); bottom: calc(10dvh + env(safe-area-inset-bottom)); left: 8vw; right: 8vw; border-top: 0.0625rem solid #2c2c2e; overflow: hidden; touch-action: none; }
    #p-lap-rows, .lap-row, .lap-row * { pointer-events: none; }
    .lap-row { display: flex; justify-content: space-between; align-items: center; height: clamp(2.25rem, 6.6dvh, 2.75rem); border-bottom: 0.04rem solid #3a3a3c; font-size: clamp(0.875rem, 4.25vw, 1.0625rem); font-variant-numeric: tabular-nums; }
    #p-tabs { position: absolute; left: 0; bottom: env(safe-area-inset-bottom); width: 100%; height: 9dvh; min-height: 3.25rem; border-top: 0.04rem solid #2c2c2e; background: #000; display: flex; align-items: center; padding: 0.25rem 3vw; }
    .tab { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem; background: transparent; color: #8e8e93; font-size: clamp(0.625rem, 2.7vw, 0.75rem); white-space: nowrap; }
    .tab svg { width: clamp(1.25rem, 6vw, 1.5rem); height: clamp(1.25rem, 6vw, 1.5rem); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { color: #ff9f0a; }
    .tab-world .core { fill: #1c1c1e; stroke: none; }
    .tab-world.feedback .core { fill: #fff; }

    /* Landscape: v1 surface; portrait viewports rotate the whole app clockwise. */
    #landscape-frame { position: absolute; inset: 0; overflow: hidden; background: #1c1c1e; }
    #landscape-app { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #1c1c1e; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    #l-time-display { display: flex; flex: 0 0 auto; align-items: center; justify-content: center; font-size: min(41vh, 26.4vw); font-variant-numeric: tabular-nums; font-weight: 200; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; pointer-events: none; }
    .l-digits { display: inline-block; min-width: 2ch; text-align: center; }
    #l-custom-display { max-width: 100vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #l-colon { width: 0.2em; height: 0.52em; margin: 0 0.075em; }
    #l-main-hit-zones { position: absolute; top: 0; left: 0; right: 0; height: 0; margin-left: env(safe-area-inset-left); margin-right: env(safe-area-inset-right); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); z-index: 1; }
    .main-hit-zone { min-width: 0; border: 0; background: transparent; }
    #l-control { display: flex; flex: 0 0 auto; align-items: center; justify-content: center; width: min(92vw, 105.6vh); height: clamp(9rem, 40.8vh, 25.5rem); border-radius: clamp(1.5rem, 5.3vh, 3.3125rem); background: transparent; box-shadow: inset 0 0.0625rem 0 rgba(255,255,255,0.25); transition: background 200ms ease, transform 120ms ease; }
    #l-control-label { font-size: max(3.875rem, min(26.4vh, 15.6vw)); font-weight: 300; letter-spacing: 0.01em; line-height: 1; white-space: nowrap; }
    #landscape-app.preset-mode { touch-action: none; }
    #landscape-app.preset-mode [data-l-digit].preset-active { border-radius: 0.12em; background: rgba(255,159,10,0.2); text-decoration: underline; text-decoration-color: #ff9f0a; text-decoration-thickness: 0.08em; text-underline-offset: 0.12em; }
    #landscape-app.preset-mode .l-digits.preset-active { position: relative; }
    #landscape-app.preset-mode .l-digits.preset-active::before, #landscape-app.preset-mode .l-digits.preset-active::after { position: absolute; left: 50%; color: #ff9f0a; font-size: 0.2em; font-weight: 600; line-height: 1; transform: translateX(-50%); }
    #landscape-app.preset-mode .l-digits.preset-active::before { content: "▲"; top: -1.45em; }
    #landscape-app.preset-mode .l-digits.preset-active::after { content: "▼"; bottom: -1.45em; }
    #landscape-app.preset-mode #l-main-hit-zones { pointer-events: none; }
    @media (orientation: portrait) {
      #landscape-app { position: fixed; top: 0; left: 0; width: 100vh; width: 100dvh; height: 100vw; height: 100dvw; transform-origin: top left; transform: translateX(100vw) rotate(90deg); transform: translateX(100dvw) rotate(90deg); padding-left: env(safe-area-inset-top); padding-right: env(safe-area-inset-bottom); }
      #l-time-display { font-size: min(41vw, 26.4vh); }
      #l-custom-display { max-width: 100vh; max-width: 100dvh; }
      #l-control { width: min(92vh, 105.6vw); height: clamp(9rem, 40.8vw, 25.5rem); border-radius: clamp(1.5rem, 5.3vw, 3.3125rem); }
      #l-control-label { font-size: max(3.875rem, min(26.4vw, 15.6vh)); }
      #l-main-hit-zones { margin-left: env(safe-area-inset-top); margin-right: env(safe-area-inset-bottom); }
    }

    #preset-hint { position: fixed; left: 50%; top: 50%; z-index: 4; max-width: min(82vw, 32rem); padding: 0.65em 0.9em; border: 0.0625rem solid rgba(255,255,255,0.18); border-radius: 0.8em; background: rgba(28,28,30,0.94); color: #fff; font-size: clamp(0.8125rem, 3.5vw, 1.25rem); line-height: 1.35; text-align: center; box-shadow: 0 0.5em 1.5em rgba(0,0,0,0.28); pointer-events: none; transform: translate(-50%, -50%); }
    #editor { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: clamp(1rem, 3dvh, 2rem); padding: 6dvh 6vw; align-items: center; justify-content: center; background: #1c1c1e; }
    #editor-input { width: min(88vw, 32rem); padding: 0.7em 0.8em; border: 0.0625rem solid rgba(255,255,255,0.25); border-radius: 0.5em; background: rgba(255,255,255,0.1); color: #fff; font: inherit; font-size: clamp(2rem, 8vw, 4rem); text-align: center; user-select: text; -webkit-user-select: text; touch-action: auto; }
    #editor-actions { display: flex; gap: clamp(0.75rem, 3vw, 1.5rem); }
    #editor-actions button { min-width: 7rem; padding: 0.7em 1.2em; border-radius: 0.7em; background: rgba(255,255,255,0.16); font-size: clamp(1.25rem, 5vw, 2rem); }
    #selftest { position: fixed; inset: 0; z-index: 10; padding: 6dvh 6vw; display: flex; align-items: center; justify-content: center; overflow: auto; background: #000; font-size: clamp(1.5rem, 6vw, 3rem); white-space: pre-wrap; }
    #selftest-result.fail { color: #ff7b7b; }
    #install-nudge { position: fixed; left: 3vw; right: 3vw; bottom: calc(1.5dvh + env(safe-area-inset-bottom)); z-index: 20; display: flex; align-items: center; gap: 2.5vw; padding: 1.2dvh 3.5vw; background: #1c1c1e; border-radius: 0.875rem; font-size: clamp(0.875rem, 3.5vw, 1rem); box-shadow: 0 0.25rem 1rem rgba(0,0,0,0.5); }
    #install-nudge span { flex: 1; }
    #install-nudge button { border-radius: 0.625rem; padding: 0.55em 0.9em; background: #ff9f0a; color: #000; }
    #install-nudge button[data-act="close"] { background: transparent; color: #8e8e93; }
  </style>
</head>
<body>
  <main id="shell">
    <section id="portrait-app" class="mode-view" aria-label="세로 스톱워치">
      <div id="p-top-band" aria-hidden="true"></div>
      <div id="p-time-display" aria-label="스톱워치 시간">
        <span id="p-numeric-display"><span id="p-minutes">00</span><span id="p-colon" class="colon" aria-hidden="true"><span class="colon-dot"></span><span class="colon-dot"></span></span><span class="p-digits"><span data-p-digit="0">0</span><span data-p-digit="1">0</span></span><span id="p-decimal">.</span><span class="p-digits"><span data-p-digit="2">0</span><span data-p-digit="3">0</span></span></span>
        <span id="p-custom-display" hidden></span>
      </div>
      <div id="p-buttons"><button id="p-lap" class="round" type="button" disabled>랩</button><span id="p-pages" aria-hidden="true"><i></i><i></i></span><button id="p-control" class="round" type="button">시작</button></div>
      <div id="p-lap-area"><div id="p-lap-rows"></div></div>
      <nav id="p-tabs" aria-label="시계">
        <button class="tab tab-world" type="button"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11"/><ellipse cx="14" cy="14" rx="5" ry="11"/><path d="M3 14h22M5 8h18M5 20h18M14 3v22"/><circle class="core" cx="14" cy="14" r="3"/></svg><span>세계 시계</span></button>
        <button class="tab" type="button"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="15" r="9"/><path d="M14 9v6l4 2M5 4L2 8M23 4l3 4M8 23l-2 3M20 23l2 3M9 3L5 6M19 3l4 3"/></svg><span>알람</span></button>
        <button class="tab active" type="button" aria-current="page"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="16" r="9"/><path d="M11 2h6M14 2v5M21 6l2 2M14 10v6l-3 3"/></svg><span>스톱워치</span></button>
        <button class="tab" type="button"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 5a10 10 0 1 1-8 4M14 2v5M3 5v6h6M14 9v7l4 2"/></svg><span>타이머</span></button>
      </nav>
    </section>
    <section id="landscape-frame" class="mode-view" hidden aria-label="가로 스톱워치">
      <div id="landscape-app">
        <div id="l-time-display" aria-label="스톱워치 시간"><span id="l-seconds" class="l-digits"><span data-l-digit="0">0</span><span data-l-digit="1">0</span></span><span id="l-colon" class="colon" aria-hidden="true"><span class="colon-dot"></span><span class="colon-dot"></span></span><span id="l-centiseconds" class="l-digits"><span data-l-digit="2">0</span><span data-l-digit="3">0</span></span><span id="l-custom-display" class="l-digits" hidden></span></div>
        <button id="l-control" type="button" aria-label="START"><span id="l-control-label">START</span></button>
        <div id="l-main-hit-zones" aria-hidden="true"><div id="l-fullscreen-zone" class="main-hit-zone"></div><div id="l-trick-zone" class="main-hit-zone"></div><div id="l-text-zone" class="main-hit-zone"></div></div>
      </div>
    </section>
    <div id="preset-hint" role="status" aria-live="polite" hidden></div>
    <div id="editor" hidden><input type="text" id="editor-input" enterkeyhint="done" aria-label="입력"><div id="editor-actions"><button id="editor-save" type="button">저장</button><button id="editor-clear" type="button">지우기</button></div></div>
  </main>
  <div id="selftest" hidden><div id="selftest-result"></div></div>
  <script>
    // PURE FUNCTIONS BEGIN
    function colonClassFor(trickState) { return trickState === "digit" ? "trick" : trickState === "text" ? "trick-text" : ""; }
    function pushPendingDigit(pending, digit) { return pending.length >= 2 ? [digit] : [...pending, digit]; }
    function digitFromPoint(x, y, w, h) {
      const width = Number.isFinite(w) && w > 0 ? w : 1;
      const height = Number.isFinite(h) && h > 0 ? h : 1;
      const px = Number.isFinite(x) ? Math.min(Math.max(x, 0), width) : 0;
      const py = Number.isFinite(y) ? Math.min(Math.max(y, 0), height) : 0;
      const col = Math.min(4, Math.floor(px / width * 5));
      const row = Math.min(1, Math.floor(py / height * 2));
      return row === 0 ? col + 1 : (col === 4 ? 0 : col + 6);
    }
    function isLeftmostScreenFifth(x, width) { return x < width / 5; }
    function composeCs(tens, ones) { return tens * 10 + ones; }
    function nextTrickState(current) { return current === "off" ? "digit" : current === "digit" ? "text" : "off"; }
    function clampElapsed(ms) { return Math.min(ms, 59990); }
    function formatCs(totalCs) {
      const value = Math.min(9999, Math.max(0, Math.floor(totalCs)));
      return { sec: String(Math.floor(value / 100)).padStart(2, "0"), cs: String(value % 100).padStart(2, "0") };
    }
    function formatTimeInput(value) {
      const digits = String(value ?? "").replace(/\D/g, "").slice(-6).padStart(6, "0");
      return `${digits.slice(0, 2)}:${digits.slice(2, 4)}.${digits.slice(4)}`;
    }
    function parseTimeInput(value) {
      const digits = String(value ?? "").replace(/\D/g, "").slice(-6).padStart(6, "0");
      return Math.min(5999, (Number(digits.slice(0, 2)) * 60 + Number(digits.slice(2, 4))) * 100 + Number(digits.slice(4)));
    }
    function presetIndexFromX(x, left, width, count = 4) {
      if (![x, left, width].every(Number.isFinite) || width <= 0 || !Number.isInteger(count) || count <= 0 || x < left || x > left + width) return null;
      return Math.min(count - 1, Math.floor((x - left) / width * count));
    }
    function applyPresetSwipe(entry, digitIndex, steps) {
      if (!/^\d{4}$/.test(entry) || !Number.isInteger(digitIndex) || digitIndex < 0 || digitIndex > 3 || !Number.isInteger(steps)) return entry;
      const digit = ((Number(entry[digitIndex]) + steps) % 10 + 10) % 10;
      return entry.slice(0, digitIndex) + digit + entry.slice(digitIndex + 1);
    }
    function toAppPoint(clientX, clientY, viewportWidth, viewportHeight, rotated) { return rotated ? { x: clientY, y: viewportWidth - clientX } : { x: clientX, y: clientY }; }
    function applyPresetGroupSwipe(entry, groupIndex, steps) {
      if (!/^\d{4}$/.test(entry) || !Number.isInteger(groupIndex) || groupIndex < 0 || groupIndex > 1 || !Number.isInteger(steps)) return entry;
      if (groupIndex === 0) {
        const sec = ((Number(entry.slice(0, 2)) + steps) % 60 + 60) % 60;
        return String(sec).padStart(2, "0") + entry.slice(2);
      }
      const cs = ((Number(entry.slice(2, 4)) + steps) % 100 + 100) % 100;
      return entry.slice(0, 2) + String(cs).padStart(2, "0");
    }
    function presetSwipePxPerStep(velocityPxPerMs) {
      const speed = Math.abs(Number(velocityPxPerMs));
      if (!Number.isFinite(speed) || speed < 0.3) return 28;
      if (speed > 1.5) return 5;
      return 14;
    }
    function presetSwipeSteps(deltaPx, velocityPxPerMs) {
      if (!Number.isFinite(deltaPx) || deltaPx === 0) return 0;
      const raw = Math.trunc(deltaPx / presetSwipePxPerStep(velocityPxPerMs));
      return Math.max(-20, Math.min(20, raw));
    }
    function nextSwipeAccumulator(acc, steps, pxPerStep, cap) {
      if (!Number.isFinite(acc)) return 0;
      if (!Number.isFinite(steps) || !Number.isFinite(pxPerStep) || pxPerStep <= 0) return acc;
      const capAbs = Number.isFinite(cap) ? Math.abs(cap) : 20;
      if (Math.abs(steps) >= capAbs) return 0;
      let remainder = acc - steps * pxPerStep;
      if (!Number.isFinite(remainder)) return 0;
      if (remainder >= pxPerStep) remainder = pxPerStep - Number.MIN_VALUE;
      else if (remainder <= -pxPerStep) remainder = -pxPerStep + Number.MIN_VALUE;
      return remainder;
    }
    function presetGroupIndexFromPoint(x, y, rect) {
      if (!rect || !Number.isFinite(x) || !Number.isFinite(y)) return null;
      const { left, top, width, height } = rect;
      if (![left, top, width, height].every(Number.isFinite) || width <= 0 || height <= 0) return null;
      const band = height * 0.4;
      if (y < top - band || y > top + height + band || x < left || x > left + width) return null;
      return x < left + width / 2 ? 0 : 1;
    }
    function resolveStoppedCs({ elapsed, trickMode, reservedTens, stopDigit }) {
      if (elapsed >= 59990) return 5999;
      if (trickMode && reservedTens !== null && stopDigit !== null) return Math.floor(elapsed / 1000) * 100 + composeCs(reservedTens, stopDigit);
      return Math.floor(elapsed / 10);
    }
    function elapsedAtAction(elapsed, started, actionNow) {
      return clampElapsed(elapsed + actionNow - started);
    }
    function resolveStopOutcome({ trickState, presetCs, customText, elapsed, reservedTens, stopDigit, presetAt = 0, textAt = 0 }) {
      if (trickState === "text") {
        if (presetCs !== null && (!customText || presetAt >= textAt)) return { kind: "cs", cs: presetCs };
        if (customText) return { kind: "text", text: customText };
      }
      return { kind: "cs", cs: resolveStoppedCs({ elapsed, trickMode: trickState === "digit", reservedTens, stopDigit }) };
    }
    function storedMode(storage) {
      try { return storage.getItem("stopwatch_ui_mode") === "landscape" ? "landscape" : "portrait"; } catch (_) { return "portrait"; }
    }
    function recognizesModeToggle(taps) {
      const valid = taps.filter(tap => tap && tap.fingers === 2 && Number.isFinite(tap.time) && Number.isFinite(tap.gap) && tap.gap <= 120);
      if (valid.length < 3) return false;
      const last = valid.slice(-3);
      return last[2].time - last[0].time <= 800;
    }
    function migrateV2Storage(storage) {
      const marker = "stopwatch_storage_migrated_v2";
      try {
        if (storage.getItem(marker) === "1") return false;
        const pairs = [["stopwatch2_preset_cs", "stopwatch_preset_cs"], ["stopwatch2_preset_at", "stopwatch_preset_at"], ["stopwatch2_custom_text", "stopwatch_custom_text"], ["stopwatch2_text_at", "stopwatch_text_at"]];
        let copied = false;
        pairs.forEach(([oldKey, newKey]) => {
          const value = storage.getItem(oldKey);
          if (storage.getItem(newKey) === null && value !== null) { storage.setItem(newKey, value); copied = true; }
        });
        storage.setItem(marker, "1");
        return copied;
      } catch (_) { return false; }
    }
    function runSelfTests() {
      const failures = [];
      const assert = (condition, name) => { if (!condition) failures.push(name); };
      function shared(prefix) {
        assert(typeof resolveStopOutcome==="function", `${prefix} resolveStopOutcome exists`);
        assert(typeof nextTrickState==="function", `${prefix} nextTrickState exists`);
        const expected = [[1,2,3,4,5],[6,7,8,9,0]];
        for (let row=0; row<2; row+=1) for (let col=0; col<5; col+=1) assert(digitFromPoint((col+.5)*100,(row+.5)*100,500,200)===expected[row][col], `${prefix} grid row ${row} col ${col}`);
