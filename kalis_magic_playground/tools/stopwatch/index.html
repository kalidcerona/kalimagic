<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Stopwatch</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, "SF Pro Display", system-ui, Roboto, sans-serif;
      background: #1C1C1E;
    }
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      overscroll-behavior: none;
      background: #1C1C1E; color: #ffffff;
    }
    [hidden] { display: none !important; }
    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      width: 100%; height: 100vh; height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: #1C1C1E;
      color: #ffffff;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #time-display {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      font-size: min(41vh, 26.4vw);
      font-variant-numeric: tabular-nums;
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }
    .digits {
      display: inline-block;
      min-width: 2ch; text-align: center;
    }
    #custom-display {
      max-width: 100vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #colon {
      display: flex;
      width: 0.2em; height: 0.52em;
      margin: 0 0.075em;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center; justify-content: space-between;
    }
    .colon-dot {
      width: 0.11em; height: 0.11em;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #ffffff; opacity: 1;
    }
    #colon.trick .colon-dot:first-child { opacity: 0.82; }
    #colon.trick-text .colon-dot { opacity: 0.6; }
    #main-hit-zones {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      margin-left: env(safe-area-inset-left);
      margin-right: env(safe-area-inset-right);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      z-index: 1;
    }
    .main-hit-zone {
      min-width: 0;
      border: 0;
      background: transparent;
    }
    #control {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: min(92vw, 105.6vh, 1056px);
      height: clamp(144px, 40.8vh, 408px);
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: clamp(24px, 5.3vh, 53px);
      appearance: none;
      -webkit-appearance: none;
      color: inherit;
      font: inherit;
      background: transparent;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
      transition: background 200ms ease, transform 120ms ease;
    }
    #control-label {
      font-size: max(62px, min(26.4vh, 15.6vw));
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 1;
      color: #ffffff;
      white-space: nowrap;
    }
    #selftest {
      position: fixed;
      inset: 0;
      display: flex;
      padding: 6vh 6vw;
      align-items: center; justify-content: center;
      overflow: auto;
      background: #1C1C1E;
      font-size: clamp(2rem, 7vh, 7rem);
      font-weight: 300; line-height: 1.25; text-align: center;
      white-space: pre-wrap;
      color: #ffffff;
    }
    #selftest-result.fail { color: #ff7b7b; }
    #text-editor {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 3vh, 2rem);
      padding: 6vh 6vw;
      align-items: center;
      justify-content: center;
      background: #1C1C1E;
    }
    #text-editor-input {
      width: min(88vw, 32rem);
      padding: 0.7em 0.8em;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 0.5em;
      background: rgba(255,255,255,0.1);
      color: #ffffff;
      font: inherit;
      font-size: clamp(2rem, 8vw, 4rem);
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
      touch-action: auto;
    }
    #text-editor-actions {
      display: flex;
      gap: clamp(0.75rem, 3vw, 1.5rem);
    }
    #text-editor-actions button {
      min-width: 7rem;
      padding: 0.7em 1.2em;
      border: 0;
      border-radius: 0.7em;
      background: rgba(255,255,255,0.16);
      color: #ffffff;
      font: inherit;
      font-size: clamp(1.25rem, 5vw, 2rem);
    }
    #app.preset-mode [data-digit] { pointer-events: auto; touch-action: none; }
    #app.preset-mode #main-hit-zones { pointer-events: none; }
    @media (orientation: portrait) {
      #app {
        position: fixed; top: 0; left: 0;
        width: 100vh; width: 100dvh;
        height: 100vw; height: 100dvw;
        min-height: 100vw; min-height: 100dvw;
        transform-origin: top left;
        transform: translateX(100vw) rotate(90deg);
        transform: translateX(100dvw) rotate(90deg);
        padding-left: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-bottom);
      }
      #time-display { font-size: min(41vw, 26.4vh); }
      #custom-display { max-width: 100vh; max-width: 100dvh; }
      #control {
        width: min(92vh, 105.6vw, 1056px);
        height: clamp(144px, 40.8vw, 408px);
        border-radius: clamp(24px, 5.3vw, 53px);
      }
      #control-label { font-size: max(62px, min(26.4vw, 15.6vh)); }
      #main-hit-zones {
        margin-left: env(safe-area-inset-top);
        margin-right: env(safe-area-inset-bottom);
      }
      #text-editor-input { width: min(88vh, 32rem); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="time-display" aria-label="스탑워치 시간">
      <span id="seconds" class="digits"><span data-digit="0">0</span><span data-digit="1">0</span></span>
      <div id="colon" aria-hidden="true">
        <div class="colon-dot"></div>
        <div class="colon-dot"></div>
      </div>
      <span id="centiseconds" class="digits"><span data-digit="2">0</span><span data-digit="3">0</span></span>
      <span id="custom-display" class="digits" hidden></span>
    </div>
    <button id="control" type="button" aria-label="START">
      <span id="control-label">START</span>
    </button>
    <div id="main-hit-zones" aria-hidden="true">
      <div id="fullscreen-zone" class="main-hit-zone"></div>
      <div id="trick-zone" class="main-hit-zone"></div>
      <div id="text-zone" class="main-hit-zone"></div>
    </div>
    <div id="text-editor" hidden>
      <input type="text" id="text-editor-input" maxlength="10" enterkeyhint="done">
      <div id="text-editor-actions">
        <button id="text-editor-save" type="button">저장</button>
        <button id="text-editor-clear" type="button">지우기</button>
      </div>
    </div>
  </div>
  <div id="selftest" hidden>
    <div id="selftest-result"></div>
  </div>
  <script>
    function digitFromPoint(x, y, w, h) {
      const width = Number.isFinite(w) && w > 0 ? w : 1;
      const height = Number.isFinite(h) && h > 0 ? h : 1;
      const px = Number.isFinite(x) ? Math.min(Math.max(x, 0), width) : 0;
      const py = Number.isFinite(y) ? Math.min(Math.max(y, 0), height) : 0;
      const col = Math.min(4, Math.floor(px / width * 5));
      const row = Math.min(1, Math.floor(py / height * 2));
      return row === 0 ? col + 1 : (col === 4 ? 0 : col + 6);
    }
    function isLeftmostScreenFifth(x, width) {
      return x < width / 5;
    }
    function composeCs(tens, ones) {
      return tens * 10 + ones;
    }
    function nextTrickState(current) {
      if (current === "off") return "digit";
      if (current === "digit") return "text";
      return "off";
    }
    function clampElapsed(ms) {
      return Math.min(ms, 59990);
    }
    function formatCs(totalCs) {
      const value = Math.min(9999, Math.max(0, Math.floor(totalCs)));
      return {
        sec: String(Math.floor(value / 100)).padStart(2, "0"),
        cs: String(value % 100).padStart(2, "0")
      };
    }
    function toAppPoint(clientX, clientY, viewportWidth, viewportHeight, rotated) {
      return rotated ? { x: clientY, y: viewportWidth - clientX } : { x: clientX, y: clientY };
    }
    function isRotatedLayout() {
      return matchMedia("(orientation: portrait)").matches;
    }
    function appSize() {
      const rotated = isRotatedLayout();
      return { width: rotated ? innerHeight : innerWidth, height: rotated ? innerWidth : innerHeight };
    }
    function applyPresetSwipe(entry, digitIndex, steps) {
      if (!/^\d{4}$/.test(entry) || !Number.isInteger(digitIndex) || digitIndex < 0 || digitIndex > 3 ||
          !Number.isInteger(steps)) return entry;
      const digit = ((Number(entry[digitIndex]) + steps) % 10 + 10) % 10;
      return entry.slice(0, digitIndex) + digit + entry.slice(digitIndex + 1);
    }
    // 정지 순간 표시할 1/100초 누적값을 정한다. 규칙 우선순위: 상한 > 트릭 합성 > 자연 경과.
    function resolveStoppedCs({ elapsed, trickMode, reservedTens, stopDigit }) {
      if (elapsed >= 59990) return 5999; // 상한 도달은 손댄 숫자가 아니라 실제 최대값
      if (trickMode && reservedTens !== null && stopDigit !== null) {
        return Math.floor(elapsed / 1000) * 100 + composeCs(reservedTens, stopDigit);
      }
      return Math.floor(elapsed / 10);
    }
    function resolveStopOutcome({ trickState, presetCs, customText, elapsed, reservedTens, stopDigit, presetAt = 0, textAt = 0 }) {
      if (trickState === "text") {
        if (presetCs !== null && (!customText || presetAt >= textAt)) return { kind: "cs", cs: presetCs };
        if (customText) return { kind: "text", text: customText };
      }
      return {
        kind: "cs",
        cs: resolveStoppedCs({ elapsed, trickMode: trickState === "digit", reservedTens, stopDigit })
      };
    }
    function runSelfTests() {
      const failures = [];
      const assert = (condition, name) => {
        if (!condition) failures.push(name);
      };
      const expected = [[1, 2, 3, 4, 5], [6, 7, 8, 9, 0]];
      for (let row = 0; row < 2; row += 1) {
        for (let col = 0; col < 5; col += 1) {
          const actual = digitFromPoint((col + 0.5) * 100, (row + 0.5) * 100, 500, 200);
          assert(actual === expected[row][col], `grid row ${row} col ${col}`);
        }
      }
      for (const [x, y] of [[-20, -20], [520, 220], [-1, 250], [900, -1]]) {
        const digit = digitFromPoint(x, y, 500, 200);
        assert(Number.isInteger(digit) && digit >= 0 && digit <= 9, `clamp ${x},${y}`);
      }
      const screenWidth = 1000;
      assert(isLeftmostScreenFifth(screenWidth / 5 - 0.01, screenWidth), "preset hold: 화면 왼쪽 1/5 안쪽");
      assert(!isLeftmostScreenFifth(screenWidth / 5, screenWidth), "preset hold: 화면 1/5 경계 제외");
      assert(isLeftmostScreenFifth(0, screenWidth), "preset hold: 화면 왼쪽 끝");
      assert(composeCs(2, 8) === 28, "compose 2,8");
      assert(composeCs(0, 0) === 0, "compose 0,0");
      assert(composeCs(9, 9) === 99, "compose 9,9");
      assert(clampElapsed(59990) === 59990, "clamp elapsed at limit");
      assert(clampElapsed(120000) === 59990, "clamp elapsed above limit");
      const isFormat = (value, sec, cs) => {
        const result = formatCs(value);
        return result.sec === sec && result.cs === cs;
      };
      assert(isFormat(0, "00", "00"), "format 0");
      assert(isFormat(728, "07", "28"), "format 728");
      assert(isFormat(5999, "59", "99"), "format 5999");
      assert(isFormat(9999, "99", "99"), "format four-digit swipe preview");
      for (const [x, y, expectedX, expectedY] of [[0, 0, 0, 390], [390, 0, 0, 0],
          [390, 844, 844, 0], [195, 422, 422, 195]]) {
        const point = toAppPoint(x, y, 390, 844, true);
        assert(point.x === expectedX && point.y === expectedY, `rotated point ${x},${y}`);
      }
      const identity = toAppPoint(123, 456, 844, 390, false);
      assert(identity.x === 123 && identity.y === 456, "point identity");
      for (const [entry, index, steps, expected] of [["0000", 3, 1, "0001"], ["0009", 3, 1, "0000"],
          ["0000", 0, -1, "9000"], ["1234", 1, 12, "1434"], ["1234", 4, 1, "1234"],
          ["1234", -1, 1, "1234"]]) {
        assert(applyPresetSwipe(entry, index, steps) === expected, `preset swipe ${entry},${index},${steps}`);
      }
      const rs = (elapsed, trickMode, reservedTens, stopDigit) =>
        resolveStoppedCs({ elapsed, trickMode, reservedTens, stopDigit });
      assert(rs(59990, true, 2, 8) === 5999, "resolve: 상한이 트릭보다 우선");
      assert(rs(3450, true, 2, 8) === 328, "resolve: 트릭 합성 03:28");
      assert(rs(3450, true, null, 8) === 345, "resolve: 주행 중 트릭 켬(예약 없음)은 자연값");
      assert(rs(3450, false, 2, 8) === 345, "resolve: 트릭 OFF는 좌표 무시");
      assert(rs(1200, true, 0, 5) === 105, "resolve: 십의 자리 0");
      for (const [preset, text, presetAt, textAt, kind] of [[1187, "KALI", 1, 2, "text"],
          [1187, "KALI", 2, 1, "cs"], [1187, "KALI", 2, 2, "cs"],
          [null, "KALI", 5, 1, "text"], [1187, "", 1, 5, "cs"]]) {
        const result = resolveStopOutcome({ trickState: "text", presetCs: preset, customText: text,
          elapsed: 3450, reservedTens: 2, stopDigit: 8, presetAt, textAt });
        assert(result.kind === kind && (kind === "text" ? result.text === "KALI" : result.cs === 1187),
          `last saved wins ${preset},${text},${presetAt},${textAt}`);
      }
      const outcome = (params) => typeof resolveStopOutcome === "function"
        ? resolveStopOutcome(params)
        : { kind: "missing" };
      let ro = outcome({
        trickState: "text", presetCs: 1187, customText: "KALI",
        elapsed: 3450, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "cs" && ro.cs === 1187, "stop outcome: timestamp 누락은 동률로 preset");
      ro = outcome({
        trickState: "text", presetCs: null, customText: "KALI",
        elapsed: 3450, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "text" && ro.text === "KALI", "stop outcome: text만 있으면 text");
      ro = outcome({
        trickState: "text", presetCs: null, customText: "",
        elapsed: 3450, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "cs" && ro.cs === 345, "stop outcome: text 설정 없으면 실측");
      ro = outcome({
        trickState: "off", presetCs: 9999, customText: "KALI",
        elapsed: 3450, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "cs" && ro.cs === 345, "stop outcome: off는 preset과 text 무시");
      ro = outcome({
        trickState: "digit", presetCs: 9999, customText: "KALI",
        elapsed: 3450, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "cs" && ro.cs === 328, "stop outcome: digit는 preset 무시");
      ro = outcome({
        trickState: "digit", presetCs: null, customText: "",
        elapsed: 3450, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "cs" && ro.cs === 328, "stop outcome: digit 합성");
      ro = outcome({
        trickState: "digit", presetCs: null, customText: "",
        elapsed: 59990, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "cs" && ro.cs === 5999, "stop outcome: digit도 59.99 상한");
      ro = outcome({
        trickState: "text", presetCs: 5999, customText: "KALI",
        elapsed: 59990, reservedTens: 2, stopDigit: 8
      });
      assert(ro.kind === "cs" && ro.cs === 5999, "stop outcome: preset 최대값 59.99");
      assert(typeof nextTrickState === "function", "trick state: 순환 함수 존재");
      if (typeof nextTrickState === "function") {
        assert(nextTrickState("off") === "digit", "trick state: off → digit");
        assert(nextTrickState("digit") === "text", "trick state: digit → text");
        assert(nextTrickState("text") === "off", "trick state: text → off");
      }
      const message = failures.length ? `FAIL\n${failures.join("\n")}` : "ALL PASS";
      const output = document.getElementById("selftest-result");
      output.textContent = message;
      output.className = failures.length ? "fail" : "";
      console.log(message);
    }
    const app = document.getElementById("app");
    const selftest = document.getElementById("selftest");
    const fullscreenZone = document.getElementById("fullscreen-zone");
    const trickZone = document.getElementById("trick-zone");
    const textZone = document.getElementById("text-zone");
    const mainHitZones = document.getElementById("main-hit-zones");
    const timeDisplay = document.getElementById("time-display");
    const control = document.getElementById("control");
    const controlLabel = document.getElementById("control-label");
    const seconds = document.getElementById("seconds");
    const centiseconds = document.getElementById("centiseconds");
    const customDisplay = document.getElementById("custom-display");
    const colon = document.getElementById("colon");
    const textEditor = document.getElementById("text-editor");
    const textEditorInput = document.getElementById("text-editor-input");
    const textEditorSave = document.getElementById("text-editor-save");
    const textEditorClear = document.getElementById("text-editor-clear");
    const digitSpans = [...timeDisplay.querySelectorAll("[data-digit]")];
    const CUSTOM_TEXT_STORAGE_KEY = "stopwatch_custom_text";
    const PRESET_STORAGE_KEY = "stopwatch_preset_cs";
    const TEXT_ZONE_HOLD_MS = 550;
    const PRESET_HOLD_MS = 700;
    const PRESET_AT_STORAGE_KEY = "stopwatch_preset_at";
    const TEXT_AT_STORAGE_KEY = "stopwatch_text_at";
    const MAIN_HIT_ZONE_GAP = 4;
    let state = "idle";
    let trickState = "off";
    let customText = "";
    let presetCs = null;
    let presetEntry = "0000";
    let presetMode = false;
    let presetGesture = null;
    let presetAt = 0;
    let textAt = 0;
    let reservedTens = null;
    let startedAt = 0;
    let stoppedCs = 0;
    let frameId = 0;
    let wakeLock = null;
    let wakeLockPending = false;
    let textZonePressTimer = 0;
    let presetHoldTimer = 0;
    let controlResizeObserver = null;
    function renderCs(totalCs) {
      const formatted = formatCs(totalCs);
      customDisplay.hidden = true;
      seconds.hidden = false;
      colon.hidden = false;
      centiseconds.hidden = false;
      const entry = formatted.sec + formatted.cs;
      digitSpans.forEach((span, index) => { span.textContent = entry[index]; });
    }
    function renderCustomText(text) {
      if (/^\d{1,2}:\d{2}$/.test(text)) {
        const [sec, cs] = text.split(":");
        customDisplay.hidden = true;
        seconds.hidden = false;
        colon.hidden = false;
        centiseconds.hidden = false;
        digitSpans[0].textContent = sec.length === 2 ? sec[0] : "";
        digitSpans[1].textContent = sec[sec.length - 1];
        digitSpans[2].textContent = cs[0];
        digitSpans[3].textContent = cs[1];
        return;
      }
      seconds.hidden = true;
      colon.hidden = true;
      centiseconds.hidden = true;
      customDisplay.hidden = false;
      customDisplay.textContent = text;
    }
    function gradient(base, pressed) {
      const top = `color-mix(in srgb, ${base} 82%, #ffffff)`;
      const value = `linear-gradient(180deg, ${top} 0%, ${base} 100%)`;
      return pressed
        ? `linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.12)), ${value}`
        : value;
    }
    let pressed = false;
    function renderState() {
      const resetBase = "linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.12) 100%)";
      const resetBackground = pressed
        ? `linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.12)), ${resetBase}`
        : resetBase;
      let label = "START";
      let background = gradient("#4C6EF5", pressed);
      if (state === "running") {
        label = "STOP";
        background = gradient("#E03131", pressed);
      } else if (state === "stopped") {
        label = "RESET";
        background = resetBackground;
      }
      controlLabel.textContent = label;
      control.setAttribute("aria-label", label);
      control.style.background = background;
      control.style.transform = pressed
        ? "scale(0.96)"
        : "none";
    }
    function finalizeStop(cs) {
      cancelAnimationFrame(frameId);
      frameId = 0;
      state = "stopped";
      stoppedCs = cs;
      renderCs(stoppedCs);
      renderState();
    }
    function finalizeStopText(text) {
      cancelAnimationFrame(frameId);
      frameId = 0;
      state = "stopped";
      renderCustomText(text);
      renderState();
    }
    function tick(now) {
      const elapsed = clampElapsed(now - startedAt);
      if (elapsed >= 59990) {
        finalizeStop(resolveStoppedCs({
          elapsed, trickMode: trickState === "digit", reservedTens, stopDigit: null
        }));
        return;
      }
      renderCs(Math.floor(elapsed / 10));
      frameId = requestAnimationFrame(tick);
    }
    function startTimer() {
      state = "running";
      startedAt = performance.now();
      renderCs(0);
      renderState();
      frameId = requestAnimationFrame(tick);
    }
    function appRect(element) {
      const rect = element.getBoundingClientRect();
      const rotated = isRotatedLayout();
      // A clockwise-rotated box's screen top-right maps to its app top-left.
      // Swap extents too; this preserves the visible control grid even while pressed/scaled.
      const origin = toAppPoint(rotated ? rect.right : rect.left, rect.top, innerWidth, innerHeight, rotated);
      return { left: origin.x, top: origin.y, width: rotated ? rect.height : rect.width,
        height: rotated ? rect.width : rect.height };
    }
    function digitFromEvent(event) {
      const rect = appRect(control);
      const point = toAppPoint(event.clientX, event.clientY, innerWidth, innerHeight, isRotatedLayout());
      return digitFromPoint(point.x - rect.left, point.y - rect.top, rect.width, rect.height);
    }
    function stopTimer(event) {
      const elapsed = clampElapsed(performance.now() - startedAt);
      const stopDigit = digitFromEvent(event);
      const o = resolveStopOutcome({
        trickState, presetCs, customText, elapsed, reservedTens, stopDigit, presetAt, textAt
      });
      if (o.kind === "text") finalizeStopText(o.text);
      else finalizeStop(o.cs);
    }
    function resetTimer() {
      cancelAnimationFrame(frameId);
      frameId = 0;
      state = "idle";
      reservedTens = null;
      stoppedCs = 0;
      renderCs(0);
      renderState();
    }
    function isPrimaryPointer(event) {
      return event.isPrimary !== false && (event.button === undefined || event.button === 0);
    }
    function handleControl(event) {
      if (presetMode) return;
      if (!isPrimaryPointer(event)) return;
      event.preventDefault();
      pressed = true;
      if (state === "idle") {
        if (trickState === "digit") reservedTens = digitFromEvent(event);
        startTimer();
      } else if (state === "running") {
        stopTimer(event);
      } else {
        resetTimer();
      }
    }
    function releasePress() {
      if (!pressed) return;
      pressed = false;
      renderState();
    }
    async function enterFullscreen() {
      if (document.fullscreenEnabled === false && !document.webkitFullscreenEnabled) return;
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const targets = [document.documentElement, document.body];
      for (const element of targets) {
        if (!element) continue;
        const request = element.requestFullscreen || element.webkitRequestFullscreen ||
          element.webkitRequestFullScreen || element.msRequestFullscreen;
        if (typeof request !== "function") continue;
        try {
          await request.call(element, { navigationUI: "hide" });
          break;
        } catch (_) {}
      }
      try {
        if (screen.orientation && typeof screen.orientation.lock === "function") {
          await screen.orientation.lock("landscape");
        }
      } catch (_) {}
    }
    function handleFullscreenZone(event) {
      if (presetMode) return;
      if (!isPrimaryPointer(event)) return;
      event.preventDefault();
      enterFullscreen();
    }
    function handleTrickZone(event) {
      if (presetMode) return;
      if (!isPrimaryPointer(event)) return;
      event.preventDefault();
      trickState = nextTrickState(trickState);
      if (trickState !== "digit") reservedTens = null;
      colon.classList.toggle("trick", trickState === "digit");
      colon.classList.toggle("trick-text", trickState === "text");
    }
    function openTextEditor() {
      textEditorInput.value = customText;
      textEditor.hidden = false;
      textEditorInput.focus();
      textEditorInput.select();
    }
    function closeTextEditor() {
      textEditor.hidden = true;
    }
    function handleTextZonePress(event) {
      if (presetMode) return;
      if (!isPrimaryPointer(event)) return;
      event.preventDefault();
      clearTextZonePress();
      textZonePressTimer = setTimeout(() => {
        textZonePressTimer = 0;
        openTextEditor();
      }, TEXT_ZONE_HOLD_MS);
    }
    function clearTextZonePress() {
      if (!textZonePressTimer) return;
      clearTimeout(textZonePressTimer);
      textZonePressTimer = 0;
    }
    function enterPresetMode() {
      if (state === "running") return;
      clearTextZonePress();
      resetTimer();
      presetEntry = String(presetCs ?? 0).padStart(4, "0");
      presetMode = true;
      app.classList.add("preset-mode");
      renderCs(Number(presetEntry));
    }
    function clearPresetHold() {
      if (!presetHoldTimer) return;
      clearTimeout(presetHoldTimer);
      presetHoldTimer = 0;
    }
    function startPresetHold() {
      clearPresetHold();
      presetHoldTimer = setTimeout(() => {
        presetHoldTimer = 0;
        enterPresetMode();
      }, PRESET_HOLD_MS);
    }
    function handleDocumentPresetPress(event) {
      if (!isPrimaryPointer(event)) return;
      if (presetMode || state === "running") return;
      if (event.target.closest && event.target.closest("#control, #text-editor, #install-nudge")) return;
      const point = toAppPoint(event.clientX, event.clientY, innerWidth, innerHeight, isRotatedLayout());
      if (isLeftmostScreenFifth(point.x, appSize().width)) startPresetHold();
    }
    function savePreset() {
      presetCs = Math.min(5999, Number(presetEntry)) || null;
      presetAt = presetCs === null ? 0 : Date.now();
      try {
        if (presetCs === null) {
          localStorage.removeItem(PRESET_STORAGE_KEY);
          localStorage.removeItem(PRESET_AT_STORAGE_KEY);
        } else {
          localStorage.setItem(PRESET_STORAGE_KEY, String(presetCs));
          localStorage.setItem(PRESET_AT_STORAGE_KEY, String(presetAt));
        }
      } catch (_) {}
      presetMode = false;
      presetGesture = null;
      app.classList.remove("preset-mode");
      renderCs(0);
    }
    function handlePresetPointerDown(event) {
      if (!presetMode || !isPrimaryPointer(event) ||
          event.target.closest("#text-editor, #install-nudge")) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const digit = event.target.closest("[data-digit]");
      const point = toAppPoint(event.clientX, event.clientY, innerWidth, innerHeight, isRotatedLayout());
      presetGesture = { pointerId: event.pointerId, index: digit ? Number(digit.dataset.digit) : null,
        start: point, entry: presetEntry, moved: false };
      app.setPointerCapture(event.pointerId);
    }
    function handlePresetPointerMove(event) {
      const gesture = presetGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      event.preventDefault();
      const point = toAppPoint(event.clientX, event.clientY, innerWidth, innerHeight, isRotatedLayout());
      if (Math.hypot(point.x - gesture.start.x, point.y - gesture.start.y) > 10) gesture.moved = true;
      if (gesture.index === null) return;
      const steps = Math.trunc((gesture.start.y - point.y) / 28);
      presetEntry = applyPresetSwipe(gesture.entry, gesture.index, steps);
      renderCs(Number(presetEntry));
    }
    function handlePresetPointerEnd(event) {
      const gesture = presetGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      if (event.type === "pointerup") handlePresetPointerMove(event);
      presetGesture = null;
      if (app.hasPointerCapture(event.pointerId)) app.releasePointerCapture(event.pointerId);
      if (event.type === "pointerup" && gesture.index === null && !gesture.moved) savePreset();
    }
    function saveCustomText() {
      const value = textEditorInput.value.trim();
      customText = value;
      textAt = value ? Date.now() : 0;
      try {
        if (value) {
          localStorage.setItem(CUSTOM_TEXT_STORAGE_KEY, value);
          localStorage.setItem(TEXT_AT_STORAGE_KEY, String(textAt));
        } else {
          localStorage.removeItem(CUSTOM_TEXT_STORAGE_KEY);
          localStorage.removeItem(TEXT_AT_STORAGE_KEY);
        }
      } catch (_) {}
      closeTextEditor();
    }
    function clearCustomText() {
      customText = "";
      textAt = 0;
      try {
        localStorage.removeItem(CUSTOM_TEXT_STORAGE_KEY);
        localStorage.removeItem(TEXT_AT_STORAGE_KEY);
      } catch (_) {}
      textEditorInput.value = "";
      closeTextEditor();
    }
    function handleTextEditorBackground(event) {
      if (event.target !== textEditorInput &&
          event.target !== textEditorSave &&
          event.target !== textEditorClear) {
        closeTextEditor();
      }
    }
    function loadCustomText() {
      try {
        customText = localStorage.getItem(CUSTOM_TEXT_STORAGE_KEY) || "";
        textAt = Number(localStorage.getItem(TEXT_AT_STORAGE_KEY)) || 0;
      } catch (_) {
        customText = "";
      }
    }
    function loadPreset() {
      try {
        const stored = localStorage.getItem(PRESET_STORAGE_KEY);
        const value = stored !== null && /^\d{1,4}$/.test(stored) ? Number(stored) : NaN;
        presetCs = Number.isInteger(value) && value > 0 && value <= 9999 ? Math.min(5999, value) : null;
        presetAt = Number(localStorage.getItem(PRESET_AT_STORAGE_KEY)) || 0;
      } catch (_) {
        presetCs = null;
      }
    }
    function updateMainHitZonesHeight() {
      const timeDisplayRect = appRect(timeDisplay);
      const controlRect = appRect(control);
      // All three DOM zones rotate with #app and cover its top band in app coordinates.
      const bottom = Math.min(timeDisplayRect.top + timeDisplayRect.height,
        controlRect.top - MAIN_HIT_ZONE_GAP, appSize().height);
      mainHitZones.style.height = `${Math.max(0, bottom)}px`;
    }
    function observeControlLayout() {
      updateMainHitZonesHeight();
      if (typeof ResizeObserver !== "function") return;
      controlResizeObserver = new ResizeObserver(updateMainHitZonesHeight);
      controlResizeObserver.observe(control);
      controlResizeObserver.observe(app);
      controlResizeObserver.observe(timeDisplay);
    }
    async function acquireWakeLock() {
      if (wakeLock || wakeLockPending || document.visibilityState !== "visible" ||
          !navigator.wakeLock || typeof navigator.wakeLock.request !== "function") return;
      wakeLockPending = true;
      try {
        const lock = await navigator.wakeLock.request("screen");
        wakeLock = lock;
        lock.addEventListener("release", () => {
          if (wakeLock === lock) wakeLock = null;
          if (document.visibilityState === "visible") acquireWakeLock();
        });
      } catch (_) {
      } finally {
        wakeLockPending = false;
      }
    }
    function initApp() {
      loadCustomText();
      loadPreset();
      control.addEventListener("pointerdown", handleControl, { passive: false });
      fullscreenZone.addEventListener("pointerdown", handleFullscreenZone, { passive: false });
      trickZone.addEventListener("pointerdown", handleTrickZone, { passive: false });
      textZone.addEventListener("pointerdown", handleTextZonePress, { passive: false });
      textEditor.addEventListener("pointerdown", handleTextEditorBackground);
      textEditorSave.addEventListener("click", saveCustomText);
      textEditorClear.addEventListener("click", clearCustomText);
      document.addEventListener("pointerdown", handlePresetPointerDown, { capture: true, passive: false });
      window.addEventListener("pointermove", handlePresetPointerMove, { passive: false });
      window.addEventListener("pointerup", handlePresetPointerEnd);
      window.addEventListener("pointercancel", handlePresetPointerEnd);
      window.addEventListener("resize", updateMainHitZonesHeight);
      window.addEventListener("pointerup", releasePress);
      window.addEventListener("pointercancel", releasePress);
      window.addEventListener("pointerup", clearTextZonePress);
      window.addEventListener("pointercancel", clearTextZonePress);
      window.addEventListener("pointerup", clearPresetHold);
      window.addEventListener("pointercancel", clearPresetHold);
      document.addEventListener("pointerdown", handleDocumentPresetPress, { passive: true });
      document.addEventListener("pointerdown", () => {
        if (!wakeLock) acquireWakeLock();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") acquireWakeLock();
      });
      observeControlLayout();
      renderState();
      acquireWakeLock();
    }
    if (location.hash === "#selftest") {
      app.hidden = true;
      selftest.hidden = false;
      runSelfTests();
    } else {
      initApp();
    }
  </script>
  <style>
    #install-nudge {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #1c1c1e;
      color: #fff;
      border-radius: 14px;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    #install-nudge span { flex: 1; }
    #install-nudge button {
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 14px;
      background: #ff9f0a;
      color: #000;
    }
    #install-nudge button[data-act="close"] {
      background: transparent;
      color: #8e8e93;
      padding: 8px;
    }
  </style>
  <script>
    (() => {
      try {
        const KEY = "installNudgeDone";
        if (localStorage.getItem(KEY)) return;
        const standalone = typeof window.matchMedia === "function" &&
          window.matchMedia("(display-mode: standalone)").matches;
        if (standalone || navigator.standalone) return;

        let deferred = null;
        let bar = null;
        const done = () => {
          try { localStorage.setItem(KEY, "1"); } catch (_) {}
          if (bar) bar.remove();
          bar = null;
          deferred = null;
        };

        window.addEventListener("appinstalled", done);
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          deferred = event;
          if (bar) return;

          bar = document.createElement("div");
          bar.id = "install-nudge";
          bar.innerHTML = '<span>홈 화면에 앱으로 설치할 수 있어요</span>' +
            '<button type="button" data-act="install">설치</button>' +
            '<button type="button" data-act="close" aria-label="닫기">✕</button>';
          bar.addEventListener("pointerdown", (event) => event.stopPropagation());
          bar.addEventListener("click", async (event) => {
            event.stopPropagation();
            const button = event.target.closest("button[data-act]");
            const act = button ? button.dataset.act : null;
            if (act === "install" && deferred) {
              const promptEvent = deferred;
              deferred = null;
              try {
                promptEvent.prompt();
                await promptEvent.userChoice;
              } catch (_) {}
              done();
            } else if (act === "close") {
              done();
            }
          });
          document.body.appendChild(bar);
        });
      } catch (_) {}
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator && location.hash !== "#selftest") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
  <script>
    var m = location.pathname.match(/^\/tools\/([a-z0-9-]+)/);
    if (m && location.hash !== "#selftest") {
      // 권한이 회수됐는지 조용히 확인. 회수됐으면 캐시를 비우고 새로고침해 로그인으로 보낸다.
      setTimeout(function () {
        try {
          if (!navigator.onLine) return;
          fetch("/tools/_check?tool=" + m[1], { credentials: "same-origin" })
            .then(function (response) { return response.json(); })
            .then(function (result) {
              if (!result || result.ok !== false || result.reason !== "revoked") return;
              return caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) {
                  return name.indexOf("kali-") === 0 ? caches.delete(name) : null;
                }));
              }).then(function () { location.reload(); });
            })
            .catch(function () {});
        } catch (error) {
          // 확인 실패는 앱 동작에 영향을 주지 않는다.
        }
      }, 4000);
    }
  </script>
</body>
