<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f7f0e0">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>플랜비 카페</title>
    <!-- Page for the love.js 11.4.1 compatibility build (tools/build_web.sh copies it over
         the generated index.html). The page sets only the largest CSS 16:9 box;
         SDL/love.js sizes the backing store with highdpi, with black bars around it. -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #canvas, #loading {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: block; touch-action: none; outline: none;
      }
      #canvas { visibility: hidden; }
      #loading {
        color: #f8f0e0; font: 600 28px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
        text-align: center; width: 90%; word-break: keep-all;
      }
      #loading small { display: block; font-size: 18px; font-weight: 400; opacity: 0.75; }
      #install-hint { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
        z-index: 10; max-width: 85%; padding: 8px 12px; background: #f7f0e0; color: #33241a;
        border: 2px solid #8c6b52; border-radius: 12px; font: 14px/1.4 sans-serif; }
      #install-hint[hidden], #install-button[hidden], #update-notice[hidden] { display: none; }
      #update-notice { position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top));
        z-index: 10; max-width: 60%; padding: 8px 12px; background: #f7f0e0; color: #33241a; word-break: keep-all;
        border: 2px solid #8c6b52; border-radius: 12px; font: 14px/1.4 sans-serif; }
      #update-notice button { min-height: 44px; min-width: 44px; font: inherit; margin-left: 8px; }
      #install-hint button { min-height: 44px; min-width: 44px; font: inherit; margin-left: 8px; }
      #install-help { position: fixed; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(420px, calc(100% - 32px)); box-sizing: border-box; padding: 20px;
        color: #33241a; background: #f7f0e0; border: 2px solid #8c6b52; border-radius: 14px;
        font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; text-align: center; }
      #install-help[hidden] { display: none; }
      #install-help h2 { margin: 0 0 8px; font-size: 21px; }
      #install-help p { margin: 0 0 16px; word-break: keep-all; }
      #install-help button { width: 100%; min-height: 52px; margin-top: 8px; font: inherit; font-weight: 700;
        color: #33241a; background: #fffaf0; border: 1px solid #8c6b52; border-radius: 9px; }
    </style>
  </head>
  <body>
    <div id="loading">플랜비 카페 불러오는 중...<small id="loading-detail">잠시만 기다려 주세요</small></div>
    <section id="install-help" role="dialog" aria-modal="true" aria-labelledby="install-help-title" hidden>
      <h2 id="install-help-title">홈 화면에 설치</h2>
      <p id="install-help-text"></p>
      <button id="install-help-close">닫기</button>
    </section>
    <aside id="update-notice" role="status" hidden>새 버전이 나왔어요. 다시 열면 바로 바뀌어요.<button id="update-notice-close">닫기</button></aside>
    <aside id="install-hint" hidden><span id="install-text"></span><button id="install-button" hidden>설치</button><button id="dismiss-hint" aria-label="설치 안내 닫기">닫기</button></aside>
    <canvas id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
      var GAME_W = 1280, GAME_H = 720;
      var installEvent = null;
      var installHint = document.getElementById("install-hint");
      var installButton = document.getElementById("install-button");
      var installed = window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches || navigator.standalone;
      var dismissed = false;
      try { dismissed = localStorage.getItem("planb-install-dismissed") === "yes"; } catch (_) {}
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      document.getElementById("install-text").textContent = ios ?
        "공유 메뉴 → 홈 화면에 추가하면 앱처럼 크게 할 수 있어요" :
        "브라우저 메뉴에서 홈 화면에 추가하면 앱처럼 크게 할 수 있어요";
      installHint.hidden = installed || dismissed;
      document.getElementById("dismiss-hint").onclick = function () {
        dismissed = true; installHint.hidden = true;
        try { localStorage.setItem("planb-install-dismissed", "yes"); } catch (_) {}
      };
      // Keep the event for the in-game 「홈 화면에 설치」 button. Chrome's own install
      // banner is only suppressed while this page shows its own install button.
      window.addEventListener("beforeinstallprompt", function (event) {
        installEvent = event;
        if (!installed && !dismissed) { event.preventDefault(); installButton.hidden = false; installHint.hidden = false; }
      });
      installButton.onclick = function () {
        if (!installEvent) return;
        installEvent.prompt();
        installEvent.userChoice.then(function () { installEvent = null; installButton.hidden = true; });
      };
      window.addEventListener("appinstalled", function () { installed = true; installHint.hidden = true; });

      // In-game 「더 보기」 → 「홈 화면에 설치」 calls love.system.openURL("planb:install");
      // love.js 11.4.1 implements openURL as window.open(url), so the page catches that URL.
      var installHelp = document.getElementById("install-help");
      function showInstallHelp(message) {
        document.getElementById("install-help-text").textContent = message;
        installHelp.hidden = false;
        document.getElementById("install-help-close").focus();
      }
      function closeInstallHelp() { installHelp.hidden = true; window.focus(); }
      document.getElementById("install-help-close").onclick = closeInstallHelp;
      installHelp.onkeydown = function (event) {
        if (event.key === "Escape") { event.preventDefault(); closeInstallHelp(); }
      };
      function runningAsApp() {   // browser fullscreen (Fullscreen API) is not the home screen app
        return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true ||
          (window.matchMedia("(display-mode: fullscreen)").matches && !document.fullscreenElement);
      }
      var MANUAL_STEPS = ios ?
        "Safari 아래쪽 공유 버튼 → 「홈 화면에 추가」를 눌러 주세요." :
        "Chrome 오른쪽 위 메뉴 ⋮ → 「홈 화면에 추가」 또는 「앱 설치」를 눌러 주세요. " +
        "이미 설치되었다고 나오면 홈 화면이나 앱 목록의 「플랜비 카페」 아이콘으로 열어 주세요.";
      var ALREADY_INSTALLED = "이미 설치되어 있어요. 홈 화면이나 앱 목록의 「플랜비 카페」 아이콘으로 열어 주세요.";
      function requestInstall() {
        if (runningAsApp()) { showInstallHelp("이미 홈 화면 앱으로 실행 중이에요."); return; }
        if (installEvent) {
          var event = installEvent;
          installHelp.hidden = true;
          new Promise(function (resolve) { resolve(event.prompt()); }).then(function () {
            return event.userChoice;
          }).then(function () {
            if (installEvent === event) { installEvent = null; installButton.hidden = true; }
          }).catch(function () { installEvent = null; showInstallHelp(MANUAL_STEPS); });
          return;
        }
        if (!navigator.getInstalledRelatedApps) { showInstallHelp(MANUAL_STEPS); return; }
        navigator.getInstalledRelatedApps().then(function (apps) {
          showInstallHelp(apps && apps.length ? ALREADY_INSTALLED : MANUAL_STEPS);
        }).catch(function () { showInstallHelp(MANUAL_STEPS); });
      }
      var openWindow = window.open;
      window.open = function (url) {
        if (String(url) === "planb:install") { requestInstall(); return null; }
        if (String(url).indexOf("planb:sync") === 0) { requestPersist(String(url)); return null; }
        return openWindow.apply(window, arguments);
      };

      // Saves: love.js keeps love.filesystem in memory and copies it to IndexedDB only on
      // "beforeunload", which phones rarely fire when an app is swiped away. The game calls
      // love.system.openURL("planb:sync?<n>&<session>&<save dir>") after each write
      // (src/core/websync.lua); the copy starts as soon as that Lua call returns (no timer).
      // tools/build_web.sh sets Module.FS once the saved files have been loaded, so an early
      // copy can never wipe them. One FS.syncfs at a time; a request during a copy queues
      // exactly one more. After a copy the page writes "<session> <n> ok|err" to
      // <save dir>/websync.txt, so the game says 「저장했어요」 only once it is in IndexedDB.
      // A copy makes IndexedDB equal to this page's files, so a page that wrote nothing must
      // never copy: an old browser tab would delete a save made in the installed app. Hiding
      // or closing copies only unsaved writes (build_web.sh drops love.js's unconditional
      // beforeunload copy), and after a copy other open pages reload their files from it.
      var syncing = false, syncAgain = false, syncQueued = false, syncDirty = false;
      var syncWanted = 0, syncFlag = null, lastReport = null;
      var saveChannel = typeof BroadcastChannel === "function" ? new BroadcastChannel("planb-saves") : null;
      function persistSaves() {
        if (syncing || !Module.FS) { syncAgain = true; return; }
        syncing = true; syncAgain = false; syncDirty = false;
        var covers = syncWanted, flag = syncFlag;
        Module.FS.syncfs(false, function (err) {
          if (err) { console.error(err); syncDirty = true; }
          else if (saveChannel) saveChannel.postMessage("saved");
          if (flag && covers) {
            lastReport = { path: flag.dir + "/websync.txt", text: flag.session + " " + covers + (err ? " err" : " ok") + "\n" };
            try { Module.FS.writeFile(lastReport.path, lastReport.text); } catch (e) { console.error(e); }
          }
          syncing = false;
          if (syncAgain) persistSaves();
        });
      }
      function requestPersist(url) {
        var args = String(url || "").split("?")[1];
        if (args) {
          var parts = args.split("&"), n = Number(parts[0]);
          if (n > 0 && parts[1] && parts[2]) {
            syncFlag = { session: parts[1], dir: parts.slice(2).join("&") };
            syncWanted = Math.max(syncWanted, n);
          }
        }
        syncDirty = true;
        if (syncQueued) return;   // several writes in one Lua call make one copy
        syncQueued = true;
        Promise.resolve().then(function () { syncQueued = false; persistSaves(); });
      }
      function flushUnsaved() { if (syncDirty || syncAgain) persistSaves(); }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") flushUnsaved();
      });
      window.addEventListener("pagehide", flushUnsaved);
      if (saveChannel) saveChannel.onmessage = function () {   // another page saved: take its files
        if (syncing || syncDirty || syncAgain || !Module.FS) return;   // our own writes copy first
        syncing = true;
        Module.FS.syncfs(true, function (err) {
          if (err) console.error(err);
          if (lastReport) { try { Module.FS.writeFile(lastReport.path, lastReport.text); } catch (e) { console.error(e); } }
          syncing = false;
          if (syncAgain) persistSaves();
        });
      };
      var startGame = null;
      var startRequested = false;
      // Every launch runs the newest deployed build: before the game starts the page asks the
      // network for sw.js (5 s limit). A new version is downloaded and switched to at once
      // (「새 버전으로 바꾸는 중...」, then one reload); offline or a failed check starts the
      // cached build. A version found after the game started is never applied mid-game: a
      // small notice says the next launch will use it.
      var bootDecision = false;
      var gameStarted = false;
      var updatingText = null;
      var bootTimer = setTimeout(startWithoutUpdate, 5000);
      function startOnce() {
        if (gameStarted || !startRequested || !bootDecision) return;
        gameStarted = true;
        clearTimeout(bootTimer);
        if (startGame) startGame();
      }
      function startWithoutUpdate() {
        if (bootDecision) return;
        bootDecision = true;
        if (updatingText) { updatingText = null; setLoading("플랜비 카페 불러오는 중...", ""); }
        startOnce();
      }
      function showUpdating(text) {
        updatingText = text;
        setLoading(text, "저장한 진행은 그대로예요");
        document.getElementById("loading").style.display = "block";
      }
      var serviceWorkerReady = new Promise(function (resolve) {
        if (!("serviceWorker" in navigator)) { resolve(null); return; }
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(resolve).catch(function (err) {
            console.error(err); resolve(null);
          });
        }, { once: true });
      });
      function updateBeforeStart(registration) {
        if (bootDecision) return;
        if (!registration || !navigator.serviceWorker.controller) { startWithoutUpdate(); return; }
        var watchingWorker = null, applying = false;
        function apply(worker) {   // switch to the downloaded version, then reload once
          if (bootDecision || applying) return;
          applying = true;
          clearTimeout(bootTimer);
          bootTimer = setTimeout(startWithoutUpdate, 15000);
          showUpdating("새 버전으로 바꾸는 중...");
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (bootDecision) return;
            bootDecision = true; location.reload();
          });
          worker.postMessage("SKIP_WAITING");
        }
        function watchInstall() {
          var worker = registration.installing;
          if (!worker || worker === watchingWorker || bootDecision) return;
          watchingWorker = worker;
          clearTimeout(bootTimer);
          bootTimer = setTimeout(startWithoutUpdate, 60000);   // a known new version is downloading
          showUpdating("새 버전 받는 중...");
          function stateChanged() {
            if (worker.state === "installed") apply(worker);
            else if (worker.state === "redundant") startWithoutUpdate();
          }
          worker.addEventListener("statechange", stateChanged);
          stateChanged();
        }
        if (registration.waiting) { apply(registration.waiting); return; }
        registration.addEventListener("updatefound", watchInstall);
        watchInstall();
        registration.update().then(function () {
          if (bootDecision || applying) return;
          if (registration.waiting) apply(registration.waiting);
          else { watchInstall(); if (!watchingWorker) startWithoutUpdate(); }
        }).catch(function () { if (!watchingWorker) startWithoutUpdate(); });
      }
      var updateNotice = document.getElementById("update-notice");
      document.getElementById("update-notice-close").onclick = function () { updateNotice.hidden = true; };
      function noticeLateUpdate(registration) {
        if (!registration || !navigator.serviceWorker.controller) return;
        function late() { if (gameStarted && registration.waiting) updateNotice.hidden = false; }
        function follow() {
          var worker = registration.installing;
          if (worker) worker.addEventListener("statechange", late);
        }
        registration.addEventListener("updatefound", follow);
        follow(); late();
      }
      serviceWorkerReady.then(function (registration) {
        updateBeforeStart(registration);
        noticeLateUpdate(registration);
      });

      // Largest 16:9 box that fits the window; the rest stays black.
      function fitCanvas() {
        var canvas = document.getElementById("canvas");
        var w = window.innerWidth, h = window.innerHeight;
        var scale = Math.min(w / GAME_W, h / GAME_H);
        var cssW = Math.floor(GAME_W * scale), cssH = Math.floor(GAME_H * scale);
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
      }
      window.addEventListener("resize", fitCanvas);
      // Late re-fit after rotation; a resize event also lets SDL pick up the new CSS box.
      window.addEventListener("orientationchange", function () {
        setTimeout(function () { window.dispatchEvent(new Event("resize")); }, 200);
      });
      fitCanvas();
      window.addEventListener("pageshow", fitCanvas);

      // Keep the screen on while the game is open and visible (rejection is fine).
      var wakeLock = null;
      function requestWakeLock() {
        if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
        navigator.wakeLock.request("screen").then(function (lock) {
          wakeLock = lock;
          lock.addEventListener("release", function () { wakeLock = null; });
        }).catch(function () {});
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") requestWakeLock();
      });
      window.addEventListener("load", requestWakeLock);
      // Some browsers only grant the lock after a user gesture.
      window.addEventListener("pointerdown", function () { if (!wakeLock) requestWakeLock(); });

      // No page scroll, zoom or long-press menu; taps go to the game.
      ["touchstart", "touchmove", "touchend", "gesturestart"].forEach(function (name) {
        document.addEventListener(name, function (e) { if (!e.target.closest("#install-hint, #install-help, #update-notice") && e.cancelable) e.preventDefault(); }, { passive: false });
      });
      window.addEventListener("keydown", function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, false);
      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      function setLoading(main, detail) {
        document.getElementById("loading").firstChild.nodeValue = main;
        document.getElementById("loading-detail").textContent = detail || "";
      }

      var Module = {
        arguments: ["./game.love"],
        postRun: [fitCanvas, function () { if (syncAgain) requestPersist(); }],
        INITIAL_MEMORY: 134217728,
        printErr: console.error.bind(console),
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          canvas.addEventListener("webglcontextlost", function (e) {
            setLoading("화면을 다시 불러와 주세요", "그래픽 연결이 끊겼어요");
            document.getElementById("loading").style.display = "block";
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function (text) {
          if (updatingText) return;   // 「새 버전으로 바꾸는 중...」 stays until the switch
          if (text) {
            setLoading("플랜비 카페 불러오는 중...", "준비 중 (" + (this.totalDependencies - this.remainingDependencies) + "/" + Math.max(1, this.totalDependencies) + ")");
          } else if (Module.remainingDependencies === 0) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("canvas").style.visibility = "visible";
            fitCanvas();
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? "loading" : "");
          if (!left) Module.setStatus("");
        }
      };
      Module.setStatus("loading");
      window.onerror = function () {
        setLoading("문제가 생겼어요", "페이지를 새로 고쳐 주세요");
        document.getElementById("loading").style.display = "block";
      };

      var applicationLoad = function () {
        startGame = function () { Love(Module); };
        startRequested = true;
        startOnce();
      };
    </script>
    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
  </body>
</html>
