<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e5e2dc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./performance.css">
  <link rel="stylesheet" href="./settings-ui.css">
  <link rel="stylesheet" href="./settings-panel.css">
  <title>벨</title>
</head>
<body>
  <button id="stage" aria-label="벨 울리기"><span class="base"><span class="dome"></span></span></button>
  <dialog aria-labelledby="title" class="settings">
    <div class="settings-b" data-settings-root>
      <div class="settings-scroll">
        <header><h1 id="title">벨 설정</h1></header>
        <div class="body-groups">
          <details>
            <summary>음색</summary>
            <select id="sound" aria-label="음색"></select> <button id="preview">미리듣기</button>
          </details>
          <details>
            <summary>배경</summary>
            <select id="background" aria-label="배경"><option value="marble">대리석</option><option value="dark">어두운 배경</option></select>
          </details>
          <details>
            <summary>첫 번째 물건</summary>
            <select id="firstItem" aria-label="첫 번째 물건"><option value="blue">카드 파랑</option><option value="red">카드 빨강</option><option value="kennedy">하프 달러 케네디</option><option value="walking">하프 달러 워킹 리버티</option><option value="barber">하프 달러 바버</option></select>
          </details>
          <details>
            <summary>두 번째 물건</summary>
            <select id="secondItem" aria-label="두 번째 물건"><option value="none">없음</option><option value="blue">카드 파랑</option><option value="red">카드 빨강</option><option value="kennedy">하프 달러 케네디</option><option value="walking">하프 달러 워킹 리버티</option><option value="barber">하프 달러 바버</option></select>
          </details>
          <details>
            <summary>진동</summary>
            <p id="vibration"></p>
          </details>
          <details>
            <summary>카드·동전 이미지 출처</summary>
            <p>케네디 · United States Mint · 미국 퍼블릭 도메인</p>
            <p>워킹 리버티 · 도안 Adolph A. Weinman (미국 퍼블릭 도메인) · 사진 Brandon Grossardt · CC BY-SA 3.0</p>
            <p>바버 · Patrick20242023 · CC BY-SA 4.0</p>
            <a href="./CARD_CREDITS.md" target="_blank" rel="noopener">카드·동전 이미지 출처</a>
          </details>
          <button id="next">다음 공연</button>
        </div>
        <p id="install-guide">홈 화면에 설치하려면 브라우저 메뉴 또는 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요.</p>
        <button id="update" hidden>새 버전 적용</button>
      </div>
      <form method="dialog"><button class="primary" autofocus>닫기</button></form>
    </div>
  </dialog>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
