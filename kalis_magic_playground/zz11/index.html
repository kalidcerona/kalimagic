<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092c21">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="회전판">
  <meta name="description" content="손가락으로 돌리는 회전판">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>회전판</title>
</head>
<body>
  <main class="stage">
    <div class="wheel-area">
      <div class="wheel-wrap" id="wheel-wrap">
        <div class="wheel" aria-hidden="true"></div>
        <svg class="spinner-arrow" id="spinner-arrow" viewBox="0 0 100 100" role="img" aria-label="중심에서 바깥쪽을 가리키는 화살표">
          <defs><linearGradient id="arrow-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d6429"/><stop offset=".25" stop-color="#f6e5a7"/><stop offset=".52" stop-color="#fff9da"/><stop offset=".78" stop-color="#d5ad62"/><stop offset="1" stop-color="#7a4e1e"/></linearGradient></defs>
          <path d="M50 4 57 23 54 23 54 49 46 49 46 23 43 23Z" fill="url(#arrow-metal)" stroke="#50300e" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M50 12V44" stroke="#fff9dc" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
        </svg>
        <div class="wheel-pin" aria-hidden="true"><span>✦</span></div>
      </div>
    </div>
    <section class="stage-bottom" aria-label="회전 상태">
      <span class="status-jewel" aria-hidden="true"></span>
      <span class="status-brand" aria-hidden="true">ROULETTE</span>
      <p id="spin-status" class="spin-status" aria-live="polite"></p>
    </section>
  </main>

  <section id="guide" class="overlay guide" role="dialog" aria-modal="true" aria-label="회전판 시작 안내" hidden>
    <div class="panel guide-panel">
      <span class="eyebrow">ROULETTE</span>
      <div class="guide-emblem" aria-hidden="true">✦</div>
      <h1>회전판</h1>
      <p class="guide-tagline">운을 맡기고, 흐름을 지켜보세요.</p>
      <div class="guide-help">
        <p><span aria-hidden="true">✦</span><span>공연 전 목표 방향을 한 번 지정하세요.</span></p>
        <p><span aria-hidden="true">⌄</span><span>두 손가락을 아래로 쓸어 설정을 여세요.</span></p>
      </div>
      <button id="guide-close" class="primary" type="button">시작하기</button>
    </div>
  </section>

  <section id="settings" class="overlay" role="dialog" aria-modal="true" aria-label="공연 설정" hidden>
    <div class="panel settings-panel">
      <header><span class="eyebrow">PERFORMANCE SETTINGS</span><button id="settings-close" class="close" aria-label="설정 닫기" type="button">×</button></header>
      <h1>회전판 설정</h1>
      <p class="setting-intro">공연 전에 목표 물건이 놓인 방향을 화면에서 한 번 터치하세요. 선택한 방향은 공연 화면에 표시되지 않습니다.</p>
      <div class="setting-row"><span>선택한 목표</span><strong id="target-value">선택 전</strong></div>
      <label class="setting-row" for="force-spin"><span>목표에 멈출 차례</span><select id="force-spin"><option value="1">첫 번째</option><option value="2">두 번째</option><option value="3">세 번째</option><option value="4">네 번째</option><option value="5">다섯 번째</option><option value="6">여섯 번째</option><option value="7">일곱 번째</option><option value="8">여덟 번째</option></select></label>
      <div class="setting-row"><span>완료한 회전</span><strong id="spin-value">0회</strong></div>
      <div class="setting-actions"><button id="reset-run" type="button">회전 횟수 초기화</button><button id="clear-target" type="button">목표 다시 선택</button></div>
      <p class="setting-note">지정한 차례 외에는 목표 방향을 피해 무작위로 멈춥니다.</p>
      <div class="install"><button id="install-app" type="button">회전판 앱 설치</button><p id="install-help" hidden></p></div>
    </div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
