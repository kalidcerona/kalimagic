<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="회전판">
  <meta name="description" content="손가락으로 돌리는 회전판">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>회전판</title>
</head>
<body>
  <main class="stage">
    <div class="stage-top"><span class="brand">KALI MAGIC</span><span class="stage-title">회전판</span></div>
    <div class="wheel-area">
      <div class="wheel-wrap" id="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel" id="wheel" role="img" aria-label="1번부터 12번까지 있는 회전판"></div>
        <div class="wheel-pin" aria-hidden="true"><span>✦</span></div>
      </div>
    </div>
    <div class="stage-bottom"><p class="instruction">손가락으로 회전판을 돌려 보세요</p><p id="spin-status" class="spin-status" aria-live="polite"></p></div>
  </main>

  <section id="guide" class="overlay guide" role="dialog" aria-modal="true" aria-label="설정 안내" hidden>
    <div class="panel guide-panel">
      <span class="eyebrow">처음 시작하기</span>
      <h1>설정 열기</h1>
      <div class="gesture-animation" aria-hidden="true"><i></i><i></i><span>↓</span></div>
      <p>화면을 <strong>두 손가락으로 아래로 쓸어내리면</strong> 공연 설정이 열립니다.</p>
      <button id="guide-close" class="primary" type="button">알겠어요</button>
    </div>
  </section>

  <section id="settings" class="overlay" role="dialog" aria-modal="true" aria-label="공연 설정" hidden>
    <div class="panel settings-panel">
      <header><span class="eyebrow">PERFORMANCE SETTINGS</span><button id="settings-close" class="close" aria-label="설정 닫기" type="button">×</button></header>
      <h1>회전판 설정</h1>
      <p class="setting-intro">공연 전에 목표 칸을 회전판에서 한 번 가볍게 누르세요. 선택한 칸은 공연 화면에 표시되지 않습니다.</p>
      <div class="setting-row"><span>선택한 목표</span><strong id="target-value">선택 전</strong></div>
      <label class="setting-row" for="force-spin"><span>목표에 멈출 차례</span><select id="force-spin"><option value="1">첫 번째</option><option value="2">두 번째</option><option value="3">세 번째</option><option value="4">네 번째</option><option value="5">다섯 번째</option><option value="6">여섯 번째</option><option value="7">일곱 번째</option><option value="8">여덟 번째</option></select></label>
      <div class="setting-row"><span>완료한 회전</span><strong id="spin-value">0회</strong></div>
      <div class="setting-actions"><button id="reset-run" type="button">회전 횟수 초기화</button><button id="clear-target" type="button">목표 다시 선택</button></div>
      <p class="setting-note">지정한 차례 외에는 목표 칸을 제외하고 무작위로 멈춥니다. 같은 칸에 연속으로 멈추지 않도록 추첨합니다.</p>
      <div class="install"><button id="install-app" type="button">회전판 앱 설치</button><p id="install-help" hidden></p></div>
    </div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
