<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c241c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TYCHE">
  <meta name="description" content="손가락으로 돌리는 회전판">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>TYCHE</title>
  <link rel="stylesheet" href="./settings-ui.css">
  <style>
    html.spinner-standalone #install-app-group { display: none !important; }
  </style>
  <script src="./settings-ui.js" defer></script>
</head>
<body data-magic-app="spinner">
  <main class="stage" data-table-theme="emerald" data-target-cue="idle">
    <div class="nap" aria-hidden="true"></div>
    <div class="cushion" aria-hidden="true"></div>
    <div class="brass-lip" aria-hidden="true"></div>
    <i class="sight sight-a" id="target-corner-left" data-target-cue="idle" aria-hidden="true"></i>
    <i class="sight sight-b" id="target-corner-right" data-target-cue="idle" aria-hidden="true"></i>
    <i class="sight sight-c" id="table-corner-left" aria-hidden="true"></i>
    <i class="sight sight-d" id="table-corner-right" aria-hidden="true"></i>
    <img class="field" aria-hidden="true" src="./casino-assets/field-marks.svg" alt="">
    <div class="rail rail-top" aria-hidden="true"></div>
    <div class="wheel-area">
      <div class="wheel-wrap" id="wheel-wrap" data-target-cue="idle">
        <div class="wheel" aria-hidden="true">
          <img class="wheel-face wheel-emerald" src="./casino-assets/wheel-emerald.svg" alt="">
          <img class="wheel-face wheel-burgundy" src="./casino-assets/wheel-burgundy.svg" alt="">
        </div>
        <img class="spinner-arrow" id="spinner-arrow" src="./casino-assets/arrow.svg" alt="" aria-hidden="true">
        <div class="wheel-pin" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div class="rail rail-bottom">
      <section class="stage-bottom" aria-label="회전 상태">
        <span class="status-jewel" aria-hidden="true"></span>
        <p id="spin-status" class="spin-status" aria-live="polite"></p>
      </section>
    </div>
  </main>
  <section id="guide" class="overlay guide" role="dialog" aria-modal="true" aria-label="회전판 시작 안내" hidden>
    <div class="panel guide-panel">
      <span class="eyebrow">ROULETTE</span>
      <div class="guide-emblem" aria-hidden="true"></div>
      <h1>회전판</h1>
      <p class="guide-tagline">운을 맡기고, 흐름을 지켜보세요.</p>
      <div class="guide-help">
        <p><span aria-hidden="true">1</span><span>공연 전 목표 방향을 한 번 지정하세요.</span></p>
        <p><span aria-hidden="true">⌄</span><span>두 손가락을 아래로 쓸어 설정을 여세요.</span></p>
      </div>
      <button id="guide-close" class="primary" type="button">시작하기</button>
    </div>
  </section>

  <section id="settings" class="overlay" role="dialog" aria-modal="true" aria-label="공연 설정" hidden>
    <div class="panel settings-panel" data-settings-root>
      <header><span class="eyebrow">티케 / 설정</span><button id="settings-close" class="close" aria-label="설정 닫기" type="button">닫기</button></header>
      <div class="identity">
        <div class="identity-copy"><span class="catalog-label">우연</span><h1>TYCHE</h1><p>우연이 잠깐 방향을 갖다.</p></div>
        <svg class="sig" viewBox="24 0 58 48" aria-label="원과 고정 방향 표식"><circle cx="53" cy="27" r="17"/><path class="accent" d="M53 2v9 M53 27l9-9"/><circle cx="53" cy="27" r="1.5"/></svg>
      </div>
      <div class="body-groups">
      <details class="settings-disclosure" open>
        <summary>목표 방향과 회전 차례</summary>
      <p class="setting-intro">공연 전에 목표 물건 방향을 한 번 터치하세요. 공연 화면에는 안 보입니다.</p>
      <div class="setting-row"><span>선택한 목표</span><strong id="target-value">선택 전</strong></div>
      <label class="setting-row" for="force-spin"><span>목표에 멈출 차례</span><select id="force-spin"><option value="1">첫 번째</option><option value="2">두 번째</option><option value="3">세 번째</option><option value="4">네 번째</option><option value="5">다섯 번째</option><option value="6">여섯 번째</option><option value="7">일곱 번째</option><option value="8">여덟 번째</option></select></label>
      <div class="setting-row"><span>완료한 회전</span><strong id="spin-value">0회</strong></div>
      <div class="setting-actions"><button id="clear-target" type="button">목표 다시 선택</button></div>
      <p class="setting-note">지정한 차례 외에는 목표 방향을 피해 무작위로 멈춥니다.</p>
      </details>
      <details class="settings-disclosure"><summary>테이블 색</summary>
      <label class="setting-row" for="table-theme"><span>테이블 색</span><select id="table-theme"><option value="emerald">딥 그린</option><option value="burgundy">와인 버건디</option></select></label>
      </details>
      <div class="install" id="install-app-group" data-install-state="browser"><button id="install-app" type="button">앱 설치</button><p id="install-help" hidden></p></div>
      </div>
      <button id="start-performance" class="primary" type="button">마술 시작</button>
    </div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
