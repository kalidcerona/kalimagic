<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img">
  <title>Emerald board</title>
  <desc>Stationary circular board. No ticks, numbers, or fixed rim pointer.</desc>
  <defs>
    <radialGradient id="emerald-basin" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#66725c"/>
      <stop offset=".42" stop-color="#3d4b3c"/>
      <stop offset="1" stop-color="#1a2820"/>
    </radialGradient>
    <linearGradient id="emerald-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7e2d0"/>
      <stop offset=".46" stop-color="#8d947c"/>
      <stop offset="1" stop-color="#3e4c3c"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="49" fill="url(#emerald-rim)"/>
  <circle cx="50" cy="50" r="44.5" fill="url(#emerald-basin)"/>
  <circle cx="50" cy="50" r="44.5" fill="none" stroke="#d9d4c2" stroke-opacity=".35" stroke-width=".6"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#d8d3c0" stroke-opacity=".16" stroke-width=".45"/>
  <path d="M18 42 A 34 34 0 0 1 46 16" fill="none" stroke="#f4f0e2" stroke-opacity=".08" stroke-width="7" stroke-linecap="round"/>
</svg>
