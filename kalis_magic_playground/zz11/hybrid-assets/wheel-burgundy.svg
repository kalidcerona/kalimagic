<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img">
  <title>Burgundy board</title>
  <desc>Stationary circular board. No ticks, numbers, or fixed rim pointer.</desc>
  <defs>
    <radialGradient id="burgundy-basin" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#7a4b56"/>
      <stop offset=".42" stop-color="#542833"/>
      <stop offset="1" stop-color="#241016"/>
    </radialGradient>
    <linearGradient id="burgundy-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e6dc"/>
      <stop offset=".46" stop-color="#b08980"/>
      <stop offset="1" stop-color="#5c3438"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="49" fill="url(#burgundy-rim)"/>
  <circle cx="50" cy="50" r="44.5" fill="url(#burgundy-basin)"/>
  <circle cx="50" cy="50" r="44.5" fill="none" stroke="#f0e4dc" stroke-opacity=".35" stroke-width=".6"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#f0e4dc" stroke-opacity=".16" stroke-width=".45"/>
  <path d="M18 42 A 34 34 0 0 1 46 16" fill="none" stroke="#f8efe8" stroke-opacity=".08" stroke-width="7" stroke-linecap="round"/>
</svg>
