<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입문 강의 영상 - 칼리형</title>
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="입문 강의 영상 - 칼리형">
    <meta property="og:description" content="구매해줘서 고마워. 천천히, 여러 번 봐.">
    <meta property="og:image" content="https://kalimagic.netlify.app/imigi3/g3.png">
    <meta property="og:url" content="https://kalimagic.netlify.app/mmbs.html">
    <meta property="og:site_name" content="칼리형의 마술 놀이터">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        .members-header {
            padding: 60px 24px 20px;
            text-align: center;
        }

        .members-logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--point-gold);
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .members-title {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .members-sub {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .members-divider {
            width: 48px;
            height: 2px;
            background: var(--point-gold);
            margin: 20px auto 0;
            border-radius: 2px;
        }

        .video-list {
            max-width: 780px;
            margin: 0 auto;
            padding: 40px 24px 80px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .video-item {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }

        .video-item:hover {
            border-color: rgba(201, 168, 76, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .video-meta {
            padding: 16px 20px 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .video-num {
            background: var(--point-gold);
            color: #121212;
            font-weight: 800;
            font-size: 0.85rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .video-label {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .video-wrapper {
            position: relative;
            padding-top: 56.25%;
            margin: 12px 0 0;
            cursor: pointer;
        }

        .video-wrapper iframe,
        .video-thumb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-wrapper iframe {
            border: none;
        }

        .video-thumb {
            object-fit: cover;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: background 0.2s;
        }

        .video-wrapper:hover .play-btn {
            background: rgba(201, 168, 76, 0.85);
        }

        .play-btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            margin-left: 4px;
        }

        .members-cta-box {
            max-width: 700px;
            margin: 0 auto;
            border-color: #8B0000;
            background: rgba(139, 0, 0, 0.05);
        }

        .members-cta-title {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 40px;
            word-break: keep-all;
        }

        .cta-button--red {
            background: #8B0000;
            color: #ffffff;
            box-shadow: 0 4px 24px rgba(139, 0, 0, 0.3);
        }

        @media (max-width: 480px) {
            .video-list {
                padding: 24px 16px 60px;
                gap: 28px;
            }
            .members-header {
                padding: 48px 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="members-header fade-in">
        <div class="members-logo">KALI</div>
        <h1 class="members-title">입문 강의 영상</h1>
        <p class="members-sub">구매해줘서 고마워. 천천히, 여러 번 봐.</p>
        <div class="members-divider"></div>
    </div>

    <div class="video-list" id="videoList"></div>

    <section class="section fade-in" style="padding-top: 40px; padding-bottom: 80px;">
        <div class="container">
            <div class="secondary-cta-box members-cta-box">
                <h2 class="members-cta-title">강의가 마음에 들었다면<br>형이 만든 다른 것들도 한번 봐봐</h2>
                <a href="works.html" class="cta-button cta-button--red">칼리형 작품 보기 →</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        const VIDEOS = [
            { num: 1, label: '인트로',           id: 'r8FCchhrdw0' },
            { num: 2, label: '이론',             id: 'lR9Udm5-eGk' },
            { num: 3, label: '카드 기본기',       id: 'M6BBmCyeZcs' },
            { num: 4, label: '요동 치는 맥박',    id: 'ILiLoTHs3dQ' },
            { num: 5, label: '느낌으로 카드 찾기', id: 'va13q_2JEwE' },
            { num: 6, label: '카드 순간 이동',    id: 'BjlzsSSbqxg' },
            { num: 7, label: '넵킨(티슈) 복구 마술', id: 'DOo_LFxjMCk' },
            { num: 8, label: '마무리',           id: 'JdYITnKjYi0' },
        ];

        const PLAY_ICON = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>`;

        const list = document.getElementById('videoList');

        VIDEOS.forEach(({ num, label, id }) => {
            const title = `입문 강의 ${num} - ${label}`;

            const meta = document.createElement('div');
            meta.className = 'video-meta';
            const badge = document.createElement('div');
            badge.className = 'video-num';
            badge.textContent = num;
            const lbl = document.createElement('div');
            lbl.className = 'video-label';
            lbl.textContent = label;
            meta.append(badge, lbl);

            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';
            wrapper.dataset.id = id;
            wrapper.dataset.title = title;
            const img = document.createElement('img');
            img.className = 'video-thumb';
            img.src = `imigi3/g${num}.png`;
            img.alt = title;
            img.loading = 'lazy';
            const btn = document.createElement('div');
            btn.className = 'play-btn';
            btn.innerHTML = PLAY_ICON;
            wrapper.append(img, btn);

            const item = document.createElement('div');
            item.className = 'video-item fade-in';
            item.append(meta, wrapper);
            list.appendChild(item);
        });

        list.addEventListener('click', e => {
            const wrapper = e.target.closest('.video-wrapper[data-id]');
            if (!wrapper) return;
            const { id, title } = wrapper.dataset;
            wrapper.removeAttribute('data-id');
            wrapper.style.cursor = 'default';
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1`;
            iframe.title = title;
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            wrapper.replaceChildren(iframe);
        });
    </script>
</body>
</html>
