<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입문 강의 영상 - 칼리형</title>
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="입문 강의 영상 - 칼리형">
    <meta property="og:description" content="구매해줘서 고마워. 천천히, 여러 번 봐.">
    <meta property="og:image" content="https://kalimagic.netlify.app/imigi3/g3.jpg">
    <meta property="og:url" content="https://kalimagic.netlify.app/mmbs.html">
    <meta property="og:site_name" content="칼리형의 마술문화 기록소">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"></noscript>
    <script src="editor.js"></script>
</head>
<body>

    <div class="members-header fade-in">
        <div class="members-logo">KALI</div>
        <p style="color:var(--point-gold);font-weight:700;font-size:0.74rem;letter-spacing:0.16em;margin:0 0 12px;">구매자 전용</p>
        <h1 class="members-title">입문 강의 영상</h1>
        <p class="members-sub">구매해줘서 고마워. 천천히, 여러 번 봐.</p>
        <div class="members-divider"></div>
    </div>

    <div class="video-list" id="videoList"></div>

    <section class="section fade-in" style="padding-top: 40px; padding-bottom: 80px;">
        <div class="container">
            <div class="secondary-cta-box members-cta-box">
                <h2 class="members-cta-title">강의가 마음에 들었다면<br>형이 만든 다른 것들도 한번 봐봐</h2>
                <a href="works.html" class="cta-button cta-button--red">칼리형 작품 보기 →</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        const VIDEOS = [
            { num: 1, label: '인트로',           id: 'r8FCchhrdw0' },
            { num: 2, label: '이론',             id: 'lR9Udm5-eGk' },
            { num: 3, label: '카드 기본기',       id: 'GX_yuuMWm4k' },
            { num: 4, label: '요동 치는 맥박',    id: 'ILiLoTHs3dQ' },
            { num: 5, label: '느낌으로 카드 찾기', id: 'va13q_2JEwE' },
            { num: 6, label: '카드 순간 이동',    id: 'BjlzsSSbqxg' },
            { num: 7, label: '넵킨(티슈) 복구 마술', id: 'DOo_LFxjMCk' },
            { num: 8, label: '마무리',           id: 'JdYITnKjYi0' },
        ];

        const PLAY_ICON = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>`;

        const list = document.getElementById('videoList');

        VIDEOS.forEach(({ num, label, id }) => {
            const title = `입문 강의 ${num} - ${label}`;

            const meta = document.createElement('div');
            meta.className = 'video-meta';
            const badge = document.createElement('div');
            badge.className = 'video-num';
            badge.textContent = num;
            const lbl = document.createElement('div');
            lbl.className = 'video-label';
            lbl.textContent = label;
            meta.append(badge, lbl);

            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';
            wrapper.dataset.id = id;
            wrapper.dataset.title = title;
            wrapper.tabIndex = 0;
            wrapper.setAttribute('role', 'button');
            wrapper.setAttribute('aria-label', title + ' 재생');
            const img = document.createElement('img');
            img.className = 'video-thumb';
            img.src = `imigi3/g${num}.jpg`;
            img.alt = title;
            img.loading = 'lazy';
            const btn = document.createElement('div');
            btn.className = 'play-btn';
            btn.innerHTML = PLAY_ICON;
            wrapper.append(img, btn);

            const item = document.createElement('div');
            item.className = 'video-item fade-in';
            item.append(meta, wrapper);
            list.appendChild(item);
        });

        function play(wrapper) {
            if (!wrapper || !wrapper.dataset.id) return;
            const { id, title } = wrapper.dataset;
            wrapper.removeAttribute('data-id');
            wrapper.removeAttribute('role');
            wrapper.removeAttribute('tabindex');
            wrapper.style.cursor = 'default';
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1`;
            iframe.title = title;
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            wrapper.replaceChildren(iframe);
        }

        list.addEventListener('click', e => {
            play(e.target.closest('.video-wrapper[data-id]'));
        });
        list.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                const wrapper = e.target.closest('.video-wrapper[data-id]');
                if (wrapper) { e.preventDefault(); play(wrapper); }
            }
        });
    </script>
</body>
</html>
